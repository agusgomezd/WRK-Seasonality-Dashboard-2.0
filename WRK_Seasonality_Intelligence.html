<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WRK Marketing &mdash; Seasonality Intelligence</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230a0908'/><path d='M4 24 Q 9 22 12 17 T 20 9' stroke='%23c9a96e' stroke-width='2.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/><circle cx='20' cy='9' r='2.8' fill='%23c9a96e'/><circle cx='20' cy='9' r='5' fill='none' stroke='%23c9a96e' stroke-width='1' opacity='.4'/></svg>">
<link rel="apple-touch-icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230a0908'/><path d='M4 24 Q 9 22 12 17 T 20 9' stroke='%23c9a96e' stroke-width='2.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/><circle cx='20' cy='9' r='2.8' fill='%23c9a96e'/></svg>">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root{
  --bg:#0a0908;--bg2:#13110f;--card:#1a1816;--card2:#22201d;
  --border:rgba(201,169,110,.10);--border2:rgba(201,169,110,.22);
  --text:#f5efe6;--text2:#a8a094;--text3:#6b6358;
  --accent:#c9a96e;--accent2:#e0c089;--accent3:#8b7548;
  --peak:#059669;--strong:#10b981;--above:#22c55e;--avg:#6366f1;
  --slight:#eab308;--below:#f97316;--trough:#dc2626;
  --blue:#3b82f6;--violet:#8b5cf6;--amber:#f59e0b;
  --font:'Inter',-apple-system,sans-serif
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);font-family:var(--font);color:var(--text);line-height:1.5;background-image:radial-gradient(ellipse at top,rgba(201,169,110,.04) 0%,transparent 55%);transition:background-image .4s ease}
.wrap{max-width:1440px;margin:0 auto;padding:24px 32px 80px}
.section{margin-bottom:56px}
.section-title{font-size:11px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;color:var(--text3);margin-bottom:24px;display:flex;align-items:center;gap:10px}
.section-title::after{content:'';flex:1;height:1px;background:var(--border)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px}
.grid4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:20px}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:28px}
.card:hover{border-color:var(--border2)}

/* === BRAND SWITCHER (sticky top bar) === */
.brand-switcher{position:sticky;top:0;z-index:100;background:rgba(10,9,8,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--border);margin:0 -32px 24px;padding:14px 32px;display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap}
.bs-left{display:flex;align-items:center;gap:14px}
.bs-logo{font-size:13px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--accent2);display:flex;align-items:center;gap:8px}
.bs-logo::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent)}
.bs-sep{width:1px;height:18px;background:var(--border)}
.bs-title{font-size:12px;font-weight:600;color:var(--text2);letter-spacing:.3px}
.bs-dropdown{position:relative;min-width:240px}
.bs-dd-btn{font-family:var(--font);font-size:13px;font-weight:700;letter-spacing:.3px;color:#0a0908;background:linear-gradient(135deg,var(--accent3),var(--accent));border:1px solid var(--accent2);border-radius:10px;padding:10px 38px 10px 16px;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:10px;width:100%;text-align:left;position:relative}
.bs-dd-btn::after{content:'';position:absolute;right:14px;top:50%;width:8px;height:8px;border-right:2px solid #0a0908;border-bottom:2px solid #0a0908;transform:translateY(-70%) rotate(45deg);transition:transform .15s}
.bs-dd-btn.open::after{transform:translateY(-30%) rotate(-135deg)}
.bs-dd-btn .dot{width:7px;height:7px;border-radius:50%;background:#0a0908;opacity:.7;flex-shrink:0}
.bs-dd-btn:hover{filter:brightness(1.05)}
.bs-dd-menu{position:absolute;top:calc(100% + 6px);right:0;left:0;background:var(--bg2);border:1px solid var(--border2);border-radius:10px;padding:6px;box-shadow:0 12px 40px rgba(0,0,0,.5);max-height:0;overflow:hidden;opacity:0;transition:max-height .2s,opacity .15s,padding .2s;pointer-events:none}
.bs-dd-menu.open{max-height:520px;opacity:1;padding:6px;pointer-events:auto}
.bs-dd-item{font-family:var(--font);font-size:12px;font-weight:600;letter-spacing:.3px;color:var(--text2);background:transparent;border:0;border-radius:7px;padding:9px 12px;cursor:pointer;transition:all .12s;display:flex;align-items:center;gap:9px;width:100%;text-align:left}
.bs-dd-item:hover{background:var(--bg);color:var(--text)}
.bs-dd-item.active{background:linear-gradient(135deg,rgba(99,102,241,.12),rgba(99,102,241,.04));color:var(--text)}
.bs-dd-item.pending{opacity:.5}
.bs-dd-item .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex-shrink:0}
.bs-tab.pending::after{content:'PENDING';font-size:8.5px;background:rgba(245,158,11,.18);color:#f59e0b;padding:2px 6px;border-radius:6px;margin-left:4px;font-weight:700;letter-spacing:.5px}

/* Header */
.header{margin-bottom:48px;display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:24px}
.brand-badge{display:inline-flex;align-items:center;gap:8px;background:rgba(201,169,110,.08);border:1px solid rgba(201,169,110,.24);border-radius:100px;padding:5px 14px 5px 10px;margin-bottom:14px}
.brand-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px rgba(201,169,110,.5)}
.brand-badge span{font-size:11px;font-weight:600;color:var(--accent2);letter-spacing:.6px}
h1{font-size:44px;font-weight:900;line-height:1.05;letter-spacing:-1.5px}
h1 em{font-style:normal;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.header-sub{color:var(--text2);font-size:14px;margin-top:10px;max-width:680px}
.header-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.meta-pill{font-size:10.5px;font-weight:600;color:var(--text3);background:var(--bg2);border:1px solid var(--border);border-radius:100px;padding:5px 12px;letter-spacing:.3px}

.kpi-grid{display:grid;grid-template-columns:repeat(4,150px);gap:12px}
.kpi-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px 16px;text-align:center;position:relative;overflow:hidden}
.kpi-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--accent),transparent);opacity:.5}
.kpi-label{font-size:10px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--text3);margin-bottom:6px}
.kpi-val{font-size:24px;font-weight:900;line-height:1.05}
.kpi-sub{font-size:10.5px;color:var(--text3);margin-top:5px}

/* Heatmap */
.heatmap{display:grid;grid-template-columns:repeat(12,1fr);gap:8px;margin-bottom:32px}
.hm-cell{border-radius:12px;padding:16px 8px 14px;text-align:center;border:1px solid rgba(255,255,255,.06);transition:transform .15s,box-shadow .15s;position:relative}
.hm-cell:hover{transform:translateY(-3px);box-shadow:0 12px 36px rgba(0,0,0,.4)}
.hm-month{font-size:12px;font-weight:700;letter-spacing:.5px;margin-bottom:10px}
.hm-coeff{font-size:22px;font-weight:900;line-height:1}
.hm-label{font-size:9px;font-weight:700;margin-top:6px;opacity:.85;letter-spacing:.5px;text-transform:uppercase}
.hm-bar{height:3px;border-radius:2px;margin-top:10px;background:rgba(255,255,255,.12)}
.hm-fill{height:100%;border-radius:2px;background:rgba(255,255,255,.7)}
.star{position:absolute;top:6px;right:7px;font-size:11px}
.c-peak{background:linear-gradient(135deg,#052e16,#064e3b);color:#6ee7b7}
.c-strong{background:linear-gradient(135deg,#14532d,#166534);color:#86efac}
.c-above{background:linear-gradient(135deg,#1a3a1a,#1e4620);color:#bbf7d0}
.c-avg{background:linear-gradient(135deg,#1e1b4b,#312e81);color:#c4b5fd}
.c-slight{background:linear-gradient(135deg,#422006,#451a03);color:#fde68a}
.c-below{background:linear-gradient(135deg,#431407,#7c2d12);color:#fca5a5}
.c-trough{background:linear-gradient(135deg,#7f1d1d,#991b1b);color:#fecaca}

/* Table */
.coeff-table{width:100%;border-collapse:collapse}
.coeff-table th{font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--text3);padding:0 12px 14px;text-align:left;border-bottom:1px solid var(--border)}
.coeff-table td{padding:11px 12px;border-bottom:1px solid rgba(255,255,255,.04);vertical-align:middle}
.coeff-table tr:last-child td{border-bottom:none}
.coeff-table tr:hover td{background:rgba(201,169,110,.025)}
.td-month{font-weight:700;font-size:13px;display:flex;align-items:center;gap:10px}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.td-coeff{font-size:18px;font-weight:900;font-variant-numeric:tabular-nums}
.bar-wrap{width:110px;height:5px;background:rgba(255,255,255,.07);border-radius:3px}
.bar-inner{height:100%;border-radius:3px}
.badge{display:inline-block;font-size:9.5px;font-weight:700;letter-spacing:.5px;padding:3px 9px;border-radius:100px;text-transform:uppercase;white-space:nowrap}
.bp{background:rgba(5,150,105,.15);color:#10b981;border:1px solid rgba(16,185,129,.25)}
.bs{background:rgba(16,185,129,.15);color:#22c55e;border:1px solid rgba(34,197,94,.25)}
.ba{background:rgba(34,197,94,.12);color:#4ade80;border:1px solid rgba(74,222,128,.2)}
.bv{background:rgba(99,102,241,.15);color:#818cf8;border:1px solid rgba(99,102,241,.25)}
.bb{background:rgba(245,158,11,.12);color:#f59e0b;border:1px solid rgba(245,158,11,.2)}
.bw{background:rgba(239,68,68,.12);color:#ef4444;border:1px solid rgba(239,68,68,.2)}
.bt{background:rgba(220,38,38,.2);color:#fca5a5;border:1px solid rgba(220,38,38,.3)}

/* Charts */
.chart-wrap{position:relative;height:260px}
.chart-wrap-tall{position:relative;height:310px}
.chart-label{font-size:15px;font-weight:700;margin-bottom:4px}
.chart-desc{font-size:11.5px;color:var(--text3);margin-bottom:18px;line-height:1.5}

/* Month cards */
.month-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.month-card{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;transition:border-color .2s,transform .15s}
.month-card:hover{border-color:var(--border2);transform:translateY(-2px)}
.mc-header{padding:14px 16px 12px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}
.mc-name{font-size:16px;font-weight:800}
.mc-coeff{font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:100px}
.mc-body{padding:14px 16px}
.mc-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}
.mc-key{font-size:11px;color:var(--text3);font-weight:500}
.mc-val{font-size:12px;font-weight:700}
.mc-div{height:1px;background:var(--border);margin:10px 0}
.mc-note{font-size:11px;color:var(--text2);line-height:1.55;margin-bottom:8px}
.mc-action{font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;padding:6px 10px;border-radius:8px;text-align:center;margin-top:10px}
.asc{background:rgba(16,185,129,.12);color:#10b981}
.aho{background:rgba(99,102,241,.12);color:#818cf8}
.are{background:rgba(245,158,11,.12);color:#f59e0b}
.apr{background:rgba(239,68,68,.12);color:#ef4444}
.mc-conf{font-size:10px;color:var(--text3);text-align:right;margin-top:6px}
.mc-verdict{font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase;text-align:center;padding:7px 6px}
.mc-why-label{font-size:9.5px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--text3);margin-bottom:5px}
.mc-val.gval{color:#3b82f6}

/* Google data emphasis */
.gblue{color:#3b82f6;font-weight:700}
.google-callout{display:flex;align-items:center;gap:14px;background:rgba(59,130,246,.06);border:1px solid rgba(59,130,246,.22);border-radius:10px;padding:13px 18px;margin-bottom:18px;font-size:12.5px;color:var(--text2);line-height:1.55}
.google-callout .gc-badge{font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:#3b82f6;background:rgba(59,130,246,.12);border:1px solid rgba(59,130,246,.3);border-radius:7px;padding:6px 10px;white-space:nowrap}
.google-callout strong{color:var(--text);font-weight:700}

/* Findings */
.finding-box{background:var(--bg2);border-radius:12px;padding:18px 20px;border-left:3px solid;margin-bottom:12px}
.fg{border-color:#10b981}
.fa{border-color:#f59e0b}
.fr{border-color:#ef4444}
.fv{border-color:var(--accent)}
.finding-title{font-size:12px;font-weight:700;margin-bottom:5px}
.finding-text{font-size:12px;color:var(--text2);line-height:1.6}
.finding-text strong{color:var(--text);font-weight:700}

/* Insights */
.insight-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px}
.insight-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px}
.insight-icon{font-size:24px;margin-bottom:12px}
.insight-title{font-size:14px;font-weight:800;margin-bottom:16px}
.insight-item{display:flex;gap:10px;margin-bottom:12px;align-items:flex-start;font-size:12.5px;color:var(--text2);line-height:1.5}
.insight-num{font-size:11px;font-weight:800;color:var(--text);background:var(--bg2);border:1px solid var(--border);border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.insight-item strong{color:var(--text);font-weight:700}
.anno{display:flex;align-items:flex-start;gap:10px;background:rgba(201,169,110,.05);border:1px solid rgba(201,169,110,.16);border-radius:10px;padding:14px 18px;font-size:12.5px;color:var(--text2);margin-bottom:20px;line-height:1.6}
.anno strong{color:var(--text);font-weight:700}

/* Day-of-week mini chart */
.dow-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:10px}
.dow-cell{background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:14px;text-align:center}
.dow-day{font-size:11px;font-weight:700;color:var(--text3);letter-spacing:1px}
.dow-rev{font-size:18px;font-weight:900;margin-top:6px}
.dow-roas{font-size:11px;font-weight:600;margin-top:3px}

/* Empty state for brands without data */
.empty-state{background:var(--card);border:1px dashed var(--border2);border-radius:20px;padding:80px 40px;text-align:center;margin-top:40px}
.empty-icon{font-size:48px;margin-bottom:16px;opacity:.5}
.empty-title{font-size:24px;font-weight:800;margin-bottom:12px}
.empty-text{font-size:14px;color:var(--text2);max-width:560px;margin:0 auto 24px;line-height:1.6}
.empty-checklist{display:inline-flex;flex-direction:column;gap:10px;background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:20px 28px;text-align:left;margin:8px auto}
.ec-item{font-size:12.5px;color:var(--text2);display:flex;gap:10px;align-items:center}
.ec-item .ec-status{font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;background:rgba(245,158,11,.18);color:#f59e0b;letter-spacing:.5px}
.ec-item.done .ec-status{background:rgba(16,185,129,.18);color:#10b981}

.footer{text-align:center;padding-top:48px;border-top:1px solid var(--border);color:var(--text3);font-size:12px;line-height:1.8}
.footer strong{color:var(--text2)}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
@media(max-width:1100px){.kpi-grid{grid-template-columns:repeat(2,1fr)}.heatmap{grid-template-columns:repeat(6,1fr)}.month-grid{grid-template-columns:repeat(2,1fr)}.grid2,.grid3,.grid4,.insight-grid,.dow-grid{grid-template-columns:1fr}}
</style>
</head>
<body>

<!-- BRAND SWITCHER -->
<div class="brand-switcher">
  <div class="bs-left">
    <div class="bs-logo">WRK Marketing</div>
    <div class="bs-sep"></div>

    <div class="bs-dd-menu" id="brandDdMenu"></div>
  </div>
</div>

<div class="wrap" id="dashboardRoot"></div>

      BUDGET_ACTIONS:['Reduce','Hold','Reduce','Reduce','Scale','Hold','Hold','Scale','Scale','Build for Q4','Max Scale','Scale'],
      EXEC_SUMMARY:'<strong>v2 (scale-normalized):</strong> House of Leon is a <strong>classic Q4-peaked luxury furniture brand</strong>: Nov coef 1.99 (2&times; annual avg) and Dec 1.21 are the true peaks. <strong>Jan (0.53) and Apr (0.64) are the real troughs</strong>. Previous v1 analysis used simple monthly averages across 4&times; hypergrowth years (2024 $5M &rarr; 2025 $12M &rarr; 2026 partial $1M+/mo), confounding growth with seasonality. The "April spring spike" narrative was driven entirely by Apr 2026 hypergrowth ($1.75M Apr 2026 vs $282k Apr 2024), NOT real seasonality. Account has grown 4&times; in 24 months with healthy ROAS improvement (2024 avg 3.87&times; &rarr; 2025 avg 5.45&times;), but the underlying seasonal shape is a classic Q4-dominant luxury pattern. Aug remains the year\'s efficiency peak (10.32&times; ROAS in 2025) — Trends "coffee table" peaks support this.',
      FINDINGS:[
        {cls:'fr',title:'v1 Methodology Error: Confused Growth With Season',text:'<strong>Previous coefficients were wrong by 20-50% per month.</strong> Apr v1 = 1.27 (inflated by 2026 hypergrowth); v2 = 0.64 (true). Nov v1 = 1.51 (suppressed by Q4 2024/2025 not in 2026 yet); v2 = 1.99. Mar v1 = 1.12; v2 = 0.66. Any prior plan that scaled into spring or pulled back in Nov was operating on inverted signal.'},
        {cls:'fg',title:'True Peak Is Nov (1.99 coef)',text:'<strong>Nov is 2&times; the annual average</strong> &mdash; the steepest peak in the portfolio. 2024 Nov: $875k. 2025 Nov: $1.93M. 2026 Nov projected: $3M+. Combine BF/CM concentration with luxury gift-buying intent and year-end home renovation budgets. Plan capacity & creative by August.'},
        {cls:'fr',title:'January Is The Real Annual Trough',text:'<strong>Jan coef 0.53</strong> &mdash; 47% below annual average. Post-holiday returns + buyer remorse on luxury purchases + soft conversion intent. Worst POAS (1.79) and Net Margin (23.6%) of any month. <strong>Cut budget 30-40% vs baseline.</strong>'},
        {cls:'fa',title:'April Is Actually A Trough (Not A Peak)',text:'v2 Apr coef = <strong>0.64</strong>. The "April spring spike" in v1 was entirely 2026 hypergrowth ($1.75M Apr 2026 vs $282k Apr 2024 vs $615k Apr 2025). Once normalized for scale, April is the second-weakest month. Same for March (0.66). <strong>Don\'t scale spring like v1 suggested.</strong>'},
        {cls:'fg',title:'Aug Is The Year\'s Efficiency Sweet Spot',text:'<strong>2025 Aug ROAS: 10.32&times;</strong> (year high) on the LOWEST spend ($107k). Coef 1.11 (above-avg demand) + lowest competitive pressure. POAS 4.32 (3yr avg). Channel-reported ROAS 5.17&times; &mdash; Google undercounts by 63%. This holds across v1/v2; methodology fix doesn\'t change Aug.'},
        {cls:'fv',title:'Account Growth: 4&times; In 24 Months, Healthy & Sustained',text:'Q1 2024: $956k &rarr; Q1 2025: $1.84M &rarr; Q1 2026: $3.7M. Every month grew 50&ndash;200% YoY. ROAS also improved 2024 (3.87 avg) &rarr; 2025 (5.45 avg). <strong>Growth is real, not noise</strong> &mdash; just don\'t mistake growth for seasonality (the v1 error).'},
      ],
      MONTH_META:[
        {s:'&#10052;',a:'Reduce',ac:'are',conf:'High',note:'<strong>The deadest month of the year for luxury furniture.</strong> Holiday budgets are spent, and post-holiday returns plus remorse on big-ticket pieces crush demand to roughly half the yearly average. Profit is the thinnest all year (24% margin, POAS just 1.79), and Google over-credits itself &mdash; reporting 4.3&times; vs a real blended 3.4&times;. Cut spend 30&ndash;40% below baseline and bank it for May and November.'},
        {s:'&#127801;',a:'Hold',ac:'aho',conf:'High',note:'<strong>A quiet recovery month, not a Valentine\'s event.</strong> Furniture isn\'t a gifting category, so demand sits ~15% below average even as shoppers slowly return. The upside is profitability &mdash; a 41% margin and $2,486 average order at a solid 4.93&times; blended ROAS. Hold spend at baseline; resist scaling into a Valentine\'s story that doesn\'t move furniture.'},
        {s:'&#127793;',a:'Reduce',ac:'are',conf:'High',note:'<strong>A real spring slowdown &mdash; not the spike the old model claimed.</strong> Demand runs about a third below average; the earlier "March is strong" read was just the account\'s 4&times; growth fooling the math. Efficiency is middling (3.98&times; blended, 32% margin, POAS 2.34). Trim spend modestly and keep dry powder for the real May window.'},
        {s:'&#127800;',a:'Reduce',ac:'are',conf:'High',note:'<strong>The second-weakest month, despite past appearances.</strong> April only looked strong because the brand was growing 4&times; year-over-year &mdash; like-for-like, demand is ~36% below average. ROAS looks fine (4.46&times; blended) but Google over-credits itself (5.38&times;) and profit is modest (POAS 2.68). Reduce spend 15&ndash;20% and wait for May.'},
        {s:'&#9728;',a:'Scale',ac:'asc',conf:'High',note:'<strong>The spring high point &mdash; Memorial Day and outdoor-furniture season.</strong> Demand runs ~15% above average and this is the most profitable month of the year: a 45.8% margin and the biggest average order ($2,746) at a strong 5.61&times; blended ROAS. A genuine scale window &mdash; push budget moderately above baseline while margins are at their peak.'},
        {s:'&#127956;',a:'Hold',ac:'aho',conf:'High',note:'<strong>An early-summer lull, but not a true trough.</strong> Demand eases to ~17% below average as the spring rush fades. Efficiency stays reasonable (4.92&times; blended, POAS 2.43) though margin slips to 29%, and Google under-counts here (3.81&times; reported vs 4.92&times; real). Hold at baseline rather than cutting &mdash; June is moderate, not weak.'},
        {s:'&#127754;',a:'Hold',ac:'aho',conf:'High',note:'<strong>Mid-summer, drifting back toward average.</strong> Demand is only ~9% below the yearly norm and efficiency is climbing &mdash; blended ROAS recovers to 6.83&times; with a healthier 3.43 POAS. Google understates the channel again (5.67&times; vs 6.83&times; real). Keep spend at baseline; a steady month as you build toward strong late summer.'},
        {s:'&#127807;',a:'Scale',ac:'asc',conf:'High',note:'<strong>The year\'s efficiency sweet spot.</strong> Demand sits ~11% above average while competition is lowest, so every dollar works hardest: the best POAS of the year (4.32), the cheapest new customer ($486), and an 8.4&times; blended ROAS (10.3&times; in 2025). Google badly under-credits August (5.2&times; reported). Scale aggressively &mdash; up to 50% above baseline.'},
        {s:'&#127794;',a:'Scale',ac:'asc',conf:'High',note:'<strong>A strong, under-rated pre-holiday window.</strong> Demand runs ~8% above average and shoppers convert at the year\'s highest rate, with a healthy 39% margin and 6.66&times; blended ROAS. Google meaningfully under-reports it (4.35&times;). Keep scaling &mdash; September sets up the budget ramp into Q4.'},
        {s:'&#127875;',a:'Build for Q4',ac:'asc',conf:'High',note:'<strong>An average month that is really about preparation.</strong> Demand sits right at the yearly norm with solid 5.18&times; blended efficiency. October\'s real job is staging for November: ramp budgets gradually, let Smart Bidding learn at higher volume, and ready BFCM creative and offers. Invest the effort in the Q4 runway, not in October itself.'},
        {s:'&#127873;',a:'Max Scale',ac:'asc',conf:'High',note:'<strong>The single biggest month of the year &mdash; twice the average.</strong> Black Friday/Cyber Monday, luxury gift-buying, and year-end renovation budgets all land at once, driving the steepest peak in the portfolio and the most new customers by far. ROAS compresses to 4.87&times; as you push volume (Google over-states it at 5.51&times;), but the scale is unmatched. Spend to the limit of inventory and fulfillment.'},
        {s:'&#127876;',a:'Scale',ac:'asc',conf:'High',note:'<strong>A strong holiday-gifting tail &mdash; the year\'s #2 month.</strong> Demand stays ~21% above average as last-minute gift and year-end buyers convert. Margin compresses to 30% but ROAS holds up well (4.88&times; blended; 7.5&times; in 2025). Keep scaling through the mid-December shipping deadline, then taper as fulfillment cutoffs hit.'},
      ],
      INSIGHTS:{
        opp:[
          '<strong>November is the biggest annual lever.</strong> v2 Nov coef 1.99 (was 1.51 in v1) &mdash; we were under-budgeting the most important month. Plan inventory, creative, BFCM offers by August. Aim for $3M+ revenue in Nov 2026 (vs $1.93M in 2025).',
          '<strong>August stays the efficiency window.</strong> 10.32&times; ROAS in 2025 on $107k spend. POAS 4.32. Channel undercounts 63%. Push to $150k+ spend at same tROAS &mdash; should produce $1.5M+ revenue.',
          '<strong>Dec is bigger than v1 said (1.21 coef vs 0.89).</strong> Holiday gifting + post-BF momentum. 2025 ROAS 7.52&times; (year-2-best). Scale through Dec 23.',
          '<strong>Sept is above-average, not flat (1.08 coef).</strong> v1 had Sept as "Hold" but it\'s a genuine scale window. ROAS 7.00&times; in 2025, margin 38.9%. Push budget +10-15%.',

        risk:[
          '<strong>v1 dashboard recommendations were inverted on multiple months.</strong> April was "Scale" but is actually a trough. June was "Reduce" but is actually moderate. If anyone is still operating on v1 actions, fix immediately.',
          '<strong>January is the deepest trough (0.53 coef).</strong> Post-holiday returns + soft luxury intent. POAS 1.79, margin 23.6%. <strong>Cut 30-40%</strong> &mdash; v1 said 25% but the v2 math says deeper. Save for May/Aug/Nov.',

          '<strong>4&times; account growth is real but doesn\'t change seasonality.</strong> The PATTERN holds even as scale grows. Plan budget against v2 coefficients, not against last-month\'s revenue (which mixes growth + season).',

          '<strong>Day-of-week pattern (unchanged from v1):</strong> Mon-Tue $16k/day at 11.5&times; ROAS; Sat-Sun $10k/day at 7.7&times;. Add +10% Mon-Tue bid mod, &minus;15% weekend.',

      EXEC_SUMMARY:'<strong>v2 Update (3-yr detrended TW data, 1,114 days):</strong> Earlier dashboard read the account\'s hypergrowth trajectory as seasonality. Corrected analysis isolates pure seasonality from growth and shows a <strong>classic Q4-peaked ecom pattern</strong>: <strong>Dec (1.68) and Nov (1.47)</strong> are the true peaks, with a secondary <strong>summer mini-peak (Jun 1.16, Jul 1.10)</strong>. <strong>Apr (0.62) and May (0.66) are the seasonal troughs.</strong> The big insight: margins are <strong>counter-cyclical</strong> &mdash; the highest POAS months are the low-volume ones (Apr 1.72&times;, Jan 1.65&times;, Mar 1.37&times;), while Q4 volume comes with thinner margins due to promo-heavy buying. <strong>This is a hypergrowth account ($540k 2023 &rarr; $24M+ 2026 trending)</strong>, so recent-year revenue numbers stay record-breaking every month &mdash; but those are growth, not seasonality. The attribution gap (Google undercounts TW by 20&ndash;140% monthly) remains a portfolio-wide pattern.',
      FINDINGS:[
        {cls:'fg',title:'True Peak Is Q4 (Holiday Coffee Gifting)',text:'<strong>Nov 1.47 &middot; Dec 1.68</strong>. Detrended from 3 years of daily blended data. This matches Google Trends "coffee maker" peaks (Nov 39.2, Dec 38.8) almost exactly. Q4 is structural demand &mdash; gift purchases for the morning-coffee-lover demographic. Max-scale this window.'},
        {cls:'fa',title:'Counter-Cyclical Margins (The Profit Hides In Spring)',text:'<strong>Apr POAS 1.72&times;, Jan 1.65&times;, May 1.21&times; (50.9% margin)</strong>. Low-demand months have the highest profit per dollar spent &mdash; buyers are full-price, premium-AOV ($316 in Apr), no Black Friday discounting. <strong>Push margin-rich products in spring, not volume.</strong> Hidden profit lever.'},
        {cls:'fg',title:'Summer Mini-Peak Is Real',text:'<strong>Jun 1.16 &middot; Jul 1.10</strong>. Both above-average. Father\'s Day + iced coffee + summer entertaining. Validated by Google Trends summer plateau and TW data showing Jun-Jul as #3&ndash;#4 seasonal months. <strong>Scale through summer &mdash; this is not a trough as previous analysis suggested.</strong>'},
        {cls:'fr',title:'V1 Methodology Error: Read Growth As Season',text:'Previous version said May was the peak (coef 1.86) and June the trough (0.43). Wrong: those numbers reflected the account\'s 4&times; scale jump in Jun 2025, not seasonality. The TTM approach compared mature months (Feb-May 2026) against pre-scale months (Jun-Sep 2025). v2 fixes this by detrending against a 365-day rolling mean before extracting season.'},
        {cls:'fv',title:'Spring 2026 Revenue Records Are Growth, Not Season',text:'Feb 2026 $2.23M, Apr 2026 $2.19M, May 2026 (annualized) $2.81M are real records &mdash; but these are <strong>growth-driven</strong>, not seasonal peaks. YoY: Feb +1142%, Apr +1376%. Once growth stabilizes, expect Q4 to deliver the biggest absolute revenue. Plan capacity accordingly.'},
        {cls:'fa',title:'Sept Is The Real Annual Trough',text:'<strong>Sep 0.79 coef + POAS 1.57 + lowest YoY momentum.</strong> Demand softens post-summer before Q4 pickup. Don\'t scale into Sept &mdash; use it for testing, list-building, and prepping Black Friday creative.'},

      MONTH_META:[
        {s:'&#10052;',a:'Scale',ac:'asc',conf:'High',note:'<strong>A quiet new-year reset month for coffee buyers.</strong> Holiday gifting is over, so demand sits about 7% below the yearly average &mdash; but the buyers who do show up are full-price and high-intent. This is the second-best profit month all year: 1.97&times; POAS on a 45.7% margin. Google under-reports here, showing 3.54&times; vs the real blended 4.32&times;. Scale moderately, and lean into margin-rich products rather than chasing volume.'},
        {s:'&#127801;',a:'Scale',ac:'asc',conf:'High',note:'<strong>Demand ticks back above average on a Valentine\'s gifting bump.</strong> Coffee makers are a popular couples\' gift, lifting volume to roughly 4% above the yearly average. Profit stays healthy at 1.82&times; POAS and a 44.1% margin. Google undercounts again &mdash; reporting 3.41&times; against a true blended 4.12&times;. Keep scaling steadily; the demand is real and the economics support it.'},
        {s:'&#127793;',a:'Hold',ac:'aho',conf:'High',note:'<strong>The spring slowdown begins as gift-season tailwinds fade.</strong> Demand drops to about 26% below the yearly average, the first soft month of the year. Economics are still solid &mdash; 1.76&times; POAS, 42.9% margin, blended 4.10&times; ROAS &mdash; and Google under-reports it at 3.35&times;. Hold spend flat and use the lull to refresh creative ahead of the April&ndash;May trough.'},
        {s:'&#127800;',a:'Margin Play',ac:'asc',conf:'High',note:'<strong>The deepest demand trough of the year &mdash; but the most profitable.</strong> Volume runs roughly 38% below average, yet the shoppers who buy are premium, full-price, and face no promo competition. That delivers the year\'s best profit: 2.15&times; POAS and the highest AOV at $316. Google badly undercounts, showing 2.73&times; vs a real 4.47&times; (a 64% gap). Don\'t cut spend &mdash; push margin-rich brewers, not volume.'},
        {s:'&#9728;',a:'Margin Play',ac:'asc',conf:'High',note:'<strong>A seasonal trough that punches far above its weight on profit.</strong> Demand sits about 34% below average, but Memorial Day and Mother\'s Day pull in exceptionally high-quality buyers: 50.9% margin (the best of the year), 2.74&times; POAS, and a blended 5.38&times; ROAS. This is the worst month for trusting Google &mdash; it reports just 2.25&times; against the real 5.38&times;, a 139% gap. Push margin and premium products, not raw volume.'},
        {s:'&#127956;',a:'Scale',ac:'asc',conf:'High',note:'<strong>The summer mini-peak kicks off with Father\'s Day and iced-coffee season.</strong> Demand climbs to about 16% above average, the third-strongest month of the year. The economics are excellent: 4.93&times; blended ROAS, 2.02&times; POAS, and a rock-bottom $53 new-customer cost. Google under-reports at 3.71&times; vs 4.93&times;. Scale aggressively &mdash; this is genuine seasonal strength.'},
        {s:'&#127754;',a:'Scale',ac:'asc',conf:'High',note:'<strong>Summer demand holds strong on iced coffee and warm-weather entertaining.</strong> Volume stays roughly 10% above average. This is the year\'s most efficient month &mdash; the highest blended ROAS at 5.02&times;, a 2.23&times; POAS, and a $54 new-customer cost. Google undercounts it at 3.62&times; vs 5.02&times;. The account has historically been timid here, so this is uncompensated efficiency &mdash; keep scaling.'},
        {s:'&#127807;',a:'Hold',ac:'aho',conf:'Medium',note:'<strong>Demand starts fading as summer winds down.</strong> Volume slips to about 14% below average. Returns are still decent &mdash; 4.24&times; blended ROAS and a thinner 1.69&times; POAS on a 39.9% margin &mdash; and Google under-reports at 3.18&times; vs 4.24&times;. Hold spend steady and avoid new bets; the soft September trough is coming and the budget is better saved for Q4.'},
        {s:'&#127794;',a:'Reduce',ac:'are',conf:'High',note:'<strong>The true annual low point, after summer ends and before holiday demand wakes up.</strong> Volume runs roughly 21% below average with the year\'s weakest profit (1.57&times; POAS, 39.4% margin) and the lowest blended ROAS at 3.97&times;. Even so, Google undercounts it at 2.76&times;. Pull spend back 10&ndash;15% and bank the savings as dry powder for the Q4 build.'},
        {s:'&#127875;',a:'Build for Q4',ac:'asc',conf:'High',note:'<strong>The pre-holiday on-ramp &mdash; demand recovering but margins still thin.</strong> Volume is back to roughly 4% below average as shoppers start their early holiday research. Margin is a slim 40.7% with a 1.68&times; POAS, and Google under-reports the blended 4.12&times; as 2.71&times;. Ramp budget gradually rather than spiking it: test Black Friday creative and build retargeting pools so you\'re ready when Nov&ndash;Dec land.'},
        {s:'&#127873;',a:'Max Scale',ac:'asc',conf:'High',note:'<strong>Peak month #2 &mdash; Black Friday and Cyber Monday drive holiday coffee gifting.</strong> Demand surges to about 47% above the yearly average. The trade-off is margin: heavy promo activity holds it to 44.3% even as volume explodes. Google still under-reports, showing 3.16&times; vs the real blended 4.48&times;. Push budget to the wall to capture the demand &mdash; just watch for promo-driven margin compression.'},
        {s:'&#127876;',a:'Max Scale',ac:'asc',conf:'High',note:'<strong>The single biggest demand month of the year &mdash; full holiday gifting season.</strong> Volume runs roughly 68% above average, the true seasonal peak. Even with gift-season promos, margin holds respectably at 44.6% (1.86&times; POAS), and Google under-reports the blended 4.16&times; as 3.03&times;. Max-scale every channel through Dec 23 to capture the year\'s largest revenue window.'},
      ],
      INSIGHTS:{
        opp:[
          '<strong>Build Q4 capacity NOW.</strong> True seasonality says Nov+Dec deliver the biggest demand pull (coef 1.47+1.68). Combined with account hypergrowth, Nov-Dec 2026 will be the biggest months in history. Lock budget, creative, and inventory plans by Aug.',
          '<strong>Counter-cyclical margin play (Jan, Mar, Apr).</strong> POAS 1.65&ndash;1.72&times;, no promo competition, premium AOV ($316 in Apr). Don\'t reduce spend in these "trough" months &mdash; instead, push margin-rich products (brewers over accessories). Profit per dollar is at its highest here.',
          '<strong>Don\'t under-scale summer.</strong> Jun coef 1.16, Jul 1.10 are real above-average months. POAS 2.0&times;+ in both. The account has historically been timid in summer &mdash; this is uncompensated efficiency.',
          '<strong>Memorial Day momentum is real but not because May is peak season.</strong> May coef is actually 0.66. The strong May 2026 results come from growth + holiday spike + Mother\'s Day. Keep pushing &mdash; just don\'t expect the same coefficient pattern in flat-growth conditions.',
        ],
        risk:[
          '<strong>v1 dashboard recommendations were inverted.</strong> If anyone is still operating on "May is peak / Jun is trough" plans, fix immediately. Anyone budgeted to scale-down Jul or scale-up Apr is on the wrong signal.',
          '<strong>July margin collapse.</strong> Detrended POAS in July is 1.08&times; (low end) and margin compresses to -3.6% due to summer promo activity. Volume is up, but profit per dollar drops. Cap discount depth or you\'ll grow revenue while killing profit.',
          '<strong>Q4 margins thin out (Oct&ndash;Nov).</strong> POAS drops to 0.88&ndash;0.97&times;. Sales come in but BF/CM promo cuts deep. This is acceptable for customer acquisition (NCPA stays competitive) but watch overall profit margin.',
          '<strong>Account still hypergrowing.</strong> 2026 trending $24M+ vs $7.6M in 2025. As growth stabilizes, expect the v2 seasonal coefficients to dominate more visibly. Re-check the model annually to validate the pattern is holding.',
        ],
        tactic:[
          '<strong>Weekend lift (+18%) confirmed in 3-yr TW data.</strong> Sun $19,795/day, Sat $19,280, Fri $18,319 vs Mon-Thu $16-17k. Add +10&ndash;15% Sat-Sun bid modifiers across non-brand campaigns.',
          '<strong>Google undercounts by 20&ndash;140% every month.</strong> Use TW for all budget decisions. Especially in May where the gap hits +139% &mdash; never trust Google ROAS alone in this window.',
          '<strong>tROAS by season (revised):</strong> Q4 (Nov-Dec) &rarr; 3.8&times; (push volume), Spring trough (Apr-May) &rarr; 4.8&times; (protect margin), Summer (Jun-Jul) &rarr; 4.5&times; (scale aggressively), Sept &rarr; 5.0&times; (efficiency-only).',
          '<strong>Trends data confirms v2 seasonality.</strong> "Coffee maker" Trends peaks Nov 39.2 and Dec 38.8 (matching our Dec/Nov coefficient peaks). "Plastic free coffee maker" peaks Mar-Apr (category awareness) and Nov (purchase intent). Demand is real, not just account artifact.',

      EXEC_SUMMARY:'Iron Neck is a <strong>classic Q4-peaked DTC fitness product</strong> (Nov 2.20, Dec 1.70 detrended coefficients) selling a single-use head harness. <strong>But the account is in sustained 3-year decline:</strong> Nov 2023 $1.83M &rarr; Nov 2025 $684k (-63%); revenue is halving roughly every 1-1.5 years. Margin is <strong>counter-cyclical</strong> &mdash; low-volume Apr/Sep deliver the highest POAS (1.97&times;/1.87&times;), while Q4 sells volume at thin margins (Nov POAS 1.09&times;). The 2025 summer discount sledgehammer (Jul 19% of revenue in discounts) <strong>failed to reverse the decline</strong>. New-customer mix is exceptionally high (80-87% every month) confirming this is a <strong>single-purchase product</strong> with no LTV runway &mdash; every declining traffic month = immediately declining revenue. Spend cut in 2026 has restored margin (Apr POAS 2.55&times;, 55% margin) at half the revenue. Long consideration cycle: Google Trends peaks April (research), revenue peaks November (purchase).',
      FINDINGS:[
        {cls:'fg',title:'True Peak Is Massive Q4',text:'<strong>Nov coef 2.20 &middot; Dec 1.70 &middot; Jan 1.10</strong>. Nov is 2.2&times; the annual average &mdash; one of the steepest seasonal patterns in the portfolio. Gift-friendly premium fitness product (head-mounted harness, ~$300+). 3 years of detrended TW blended confirms this is structural demand.'},
        {cls:'fr',title:'Account In Sustained 3-Year Decline',text:'Nov 2023 <strong>$1.83M</strong> &rarr; Nov 2024 <strong>$891k</strong> &rarr; Nov 2025 <strong>$684k</strong> (-63% over 24 months). Same downtrend across every month. Total annual revenue is approximately halving every 1&ndash;1.5 years. This is structural &mdash; not seasonal noise.'},
        {cls:'fa',title:'Counter-Cyclical Margin Pattern',text:'<strong>Apr POAS 1.97&times; (45.1% margin), Sep 1.87&times; (46.1% margin) &mdash; the LOW-volume months.</strong> Nov POAS only 1.09&times; (35.0% margin) &mdash; the HIGH-volume month. Q4 trades margin for volume (BFCM promo + new-customer push). Q2/Q3 sells at full margin to fewer high-quality buyers.'},
        {cls:'fg',title:'April Is The Quality-Buyer Window',text:'Coef 0.70 (seasonal trough) BUT POAS 1.97&times;, margin 45.1%, AOV $179. April 2026 spike: POAS hit 2.55&times;, 55.4% margin. This is the brand\'s most profitable window despite being a revenue trough &mdash; quality intent buyers, no promo competition, full-margin sales.'},
        {cls:'fr',title:'Single-Purchase Product Reality',text:'<strong>80&ndash;87% new customers EVERY MONTH.</strong> Most brands run 30&ndash;50% new. Iron Neck buyers don\'t repeat &mdash; you buy one $300 neck harness for life. <strong>No LTV recovery mechanism.</strong> Declining ad traffic = immediately declining revenue. Must fix top-of-funnel acquisition or accept continued decline.'},
        {cls:'fa',title:'Summer 2025 Discount Sledgehammer Failed',text:'Jul 2025 hit <strong>19% discount rate</strong> (vs typical 3&ndash;5%), Aug 14.8%. Revenue still <strong>declined YoY</strong> ($461k 2023 &rarr; $421k 2024 &rarr; $379k 2025). The discount strategy didn\'t fix the demand problem &mdash; it just cut margin. Stop trying to discount-out of a structural decline.'},

        {s:'&#10052;',a:'Scale',ac:'asc',conf:'High',note:'<strong>New Year resolutions and post-holiday gift cards bring the year\'s second buying wave.</strong> Demand runs about 10% above the yearly average, and 2025 hit a record $848k. Profit is decent (POAS 1.70&times;, 34.6% margin), and this is the one month Google slightly over-credits itself &mdash; reporting 3.12&times; vs a real blended 3.02&times;. Scale spend hard while resolution intent is hot.'},
        {s:'&#128150;',a:'Hold',ac:'aho',conf:'High',note:'<strong>The post-Q4 comedown &mdash; demand normalizes after the holiday surge.</strong> Revenue eases to roughly 7% below the yearly average, but margin recovers nicely to 42.6% (POAS 1.70&times;). Google under-reports here, showing 2.34&times; against a true blended 3.64&times;. Hold spend steady; this is a maintenance month, not a place for big bets.'},
        {s:'&#127793;',a:'Margin Play',ac:'asc',conf:'High',note:'<strong>Seasonal slowdown begins as buyers shift to spring research rather than purchase.</strong> Volume sits around 28% below the yearly average, but the buyers who do convert are high quality (POAS 1.93&times;, 43.7% margin). Google badly under-reports &mdash; 2.47&times; vs a real blended 3.78&times;. Chase profit, not volume: hold efficient spend and let margin carry the month.'},
        {s:'&#127800;',a:'Max Margin',ac:'asc',conf:'High',note:'<strong>The annual revenue trough &mdash; but also the most profitable window of the year.</strong> Volume is roughly 30% below average, yet this delivers the best margin all year (POAS 1.97&times;, 45.1% margin; 2026 hit a record 2.55&times; POAS at 55.4% margin). Google massively under-reports, showing 2.55&times; vs a real blended 4.60&times;. Quality buyers, zero promo pressure &mdash; protect this window, don\'t cut.'},
        {s:'&#9728;',a:'Hold',ac:'aho',conf:'Medium',note:'<strong>A quiet spring month with only a mild Mother\'s Day lift.</strong> Demand runs about 24% below the yearly average at solid margin (POAS 1.64&times;, 40.9%), though the discount rate starts creeping up to 5.6%. Google under-reports at 2.41&times; vs a real blended 4.59&times;. Hold spend steady &mdash; no big bets, keep discounts in check.'},
        {s:'&#127956;',a:'Hold',ac:'aho',conf:'Medium',note:'<strong>Summer slowdown sets in, softened only by a small Father\'s Day bump.</strong> Revenue runs roughly 22% below the yearly average at fair margin (POAS 1.61&times;, 41.7%). Google heavily under-reports here, showing just 1.57&times; against a real blended 2.93&times;. Hold spend; let the seasonal lull pass without overspending.'},
        {s:'&#127754;',a:'Caution',ac:'are',conf:'High',note:'<strong>Mid-summer demand where heavy discounting has historically backfired.</strong> Volume sits about 15% below average at thin margin (POAS 1.61&times;, 40.3%); in 2025 the discount rate hit 19% and revenue still fell year over year. Google under-reports at 1.66&times; vs a real blended 2.97&times;. Cap discount depth under 7% or skip promos &mdash; don\'t buy revenue you\'ll lose anyway.'},
        {s:'&#127825;',a:'Margin Play',ac:'asc',conf:'High',note:'<strong>A high-quality late-summer window when discount discipline holds.</strong> Demand runs roughly 27% below the yearly average, but margin is among the year\'s best (POAS 1.93&times;, 44.3%). Google under-reports, showing 2.16&times; against a real blended 3.30&times;. Play for margin, not volume &mdash; don\'t flood the market with promos and erode the strongest buyers.'},
        {s:'&#127810;',a:'Build for Q4',ac:'asc',conf:'High',note:'<strong>The annual trough &mdash; lowest demand, yet the single most efficient month.</strong> Revenue runs about 35% below average, but margin tops the year (POAS 1.87&times;, 46.1%). Google under-reports at 1.87&times; vs a real blended 3.17&times;. Don\'t cut &mdash; use this window to build BFCM retargeting pools, test fresh Q4 creative, and capture spring researchers before they buy.'},
        {s:'&#127875;',a:'Build for Q4',ac:'asc',conf:'High',note:'<strong>The pre-holiday ramp as shoppers start circling the Q4 gift season.</strong> Demand climbs toward the yearly average (about 11% below), but margin thins as BFCM prep begins (POAS 1.34&times;, 38.3%). Google under-reports, showing 1.58&times; against a real blended 2.89&times;. Begin scaling budget gradually and test creative variations ahead of the November surge.'},
        {s:'&#127873;',a:'Max Scale',ac:'asc',conf:'High',note:'<strong>The true peak &mdash; this gift-friendly product explodes for the holidays.</strong> November runs about 120% above the yearly average (2.2&times; a normal month), trading margin for sheer volume (POAS 1.09&times;, 35.0%; 85.8% new customers). Google under-reports at 2.20&times; vs a real blended 2.59&times;. Push budget to the wall &mdash; this one month defines the year.'},
        {s:'&#127876;',a:'Max Scale',ac:'asc',conf:'High',note:'<strong>The holiday gifting peak continues straight through the Dec 23 cutoff.</strong> Revenue runs roughly 70% above the yearly average at recovering margin (POAS 1.32&times;, 38.2%). Google under-reports, showing 2.79&times; against a real blended 3.08&times;. Keep budgets maxed &mdash; December delivers consistent results year after year even when November swings.'},
      ],
      INSIGHTS:{
        opp:[
          '<strong>Q4 capacity build (the only window that matters).</strong> Nov + Dec combined = 3.9x of average month. Plan creative, budget, inventory by Sept. The brand\'s annual outcome is decided in 8 weeks.',
          '<strong>April-September margin focus.</strong> Six straight months of POAS 1.6&ndash;2.0&times; with margins 40&ndash;46%. Don\'t reduce spend just because revenue is "low" &mdash; profit is at its highest here. Push margin-rich product variants (Pro, Alpha).',
          '<strong>Brand search is the entire economic engine.</strong> "iron neck" alone = $688k/yr (51% of total revenue) at 23.7&times; ROAS. Joe Rogan halo terms ("joe rogan iron neck") at 46&ndash;48&times;. Lock down brand bidding, protect from competitor poaching.',
          '<strong>Pause/reduce losing non-brand channels.</strong> Shopping NB 1.73&times;, Search NB 1.35&times;, Video DG 0.77&times;, Demand Gen 1.70&times;. Combined waste: ~$55k/yr. Reallocate to PMax Brand or test new audience angles.',
        ],
        risk:[
          '<strong>3-year decline is structural, not cyclical.</strong> Revenue halving every 18 months. Without intervention (new product, new audience, new positioning), Nov 2026 will be ~$340k. The seasonality coefficients tell you WHEN to spend; they don\'t fix the demand problem.',
          '<strong>Single-purchase product caps growth.</strong> 80-87% new customer mix every month confirms no LTV runway. The business model depends entirely on new-customer acquisition flow. If CAC rises or top-of-funnel breaks, revenue collapses immediately.',
          '<strong>Heavy discounting doesn\'t work.</strong> July 2025: 19% discount rate, revenue still down YoY. Stop trying to promo-out of a structural problem &mdash; it only cuts margin.',
          '<strong>Account-reported ROAS misleading by +80&ndash;100% most months.</strong> Google channel-ROAS averages ~2&times;, blended TW ~4&times;. Decisions made on Google-only views will systematically underinvest.',
        ],
        tactic:[

          '<strong>Spring search, fall purchase.</strong> Google Trends peaks April (neck training 19, strengthening 26, pain relief 25). Revenue peaks November. Long consideration cycle. <strong>Use Apr-May for retargeting list-building and email capture, save direct-response budget for Sept-Dec close.</strong>',
          '<strong>tROAS by season:</strong> Q4 (Nov-Dec) &rarr; 2.5&times; (push volume), Mar-Apr &rarr; 4.0&times; (protect margin), Jul-Aug &rarr; 3.5&times; (cap discounts), Sept &rarr; 4.5&times; (efficiency build). Don\'t use one annual tROAS.',
          '<strong>Joe Rogan halo is real ($2,800/$58 = 47.9&times;).</strong> Audit ad creative for podcast-mention angle. The product has earned media value that should be amplified in paid creative.',

      BUDGET_ACTIONS:['Hold','Hold','Scale','Hold','Hold','Scale','Reduce','Hold','Hold','Build for Q4','Max Scale','Hold'],
      EXEC_SUMMARY:'POPFLEX is the <strong>healthiest brand in the portfolio</strong>. 3-year TW totals: <strong>$139M revenue, $82.4M profit, 59.3% net margin, 27.37&times; blended ROAS</strong>. The earlier "Google Ads declining" narrative was <strong>misleading</strong> &mdash; Google represents only ~11% of total revenue. The full business is <strong>GROWING</strong> (2024 +53%, 2025 +16% YoY). Seasonality is <strong>flat most of the year with one massive November spike</strong>: November = 2.06&times; an average month (Black Friday / Cyber Monday concentration), $8.1M in 2024 and $9.98M in 2025. Outside November, most months sit at 0.7&ndash;1.1&times; with mild lifts in Mar/Jun. MER (ad spend / revenue) is only <strong>4.3%</strong> &mdash; elite-tier for DTC. Brand defense generates $483k revenue at 25&times; ROAS from just $19k spend. The <strong>Video channel is wildly underspent</strong> at $13.6k for $515k revenue (37.72&times; ROAS).',
      FINDINGS:[
        {cls:'fg',title:'Healthiest Brand In Portfolio',text:'<strong>3yr: $139M revenue, $82.4M profit, 59.3% net margin, MER 4.3%.</strong> Account is GROWING: 2023 $32M &rarr; 2024 $50M (+53%) &rarr; 2025 $57M (+16%). 27.37&times; blended ROAS is portfolio-leading. POPFLEX is a brand-led business with ads as a thin layer on top of organic + community demand.'},
        {cls:'fa',title:'November Is A Massive 2&times; Spike (Corrected)',text:'<strong>November = 2.06&times; an average month</strong> &mdash; $8.14M in 2024, $9.98M in 2025, the biggest month every year by far (BFCM concentration). An earlier version of this analysis wrongly showed March as the peak: the detrend method had excluded Nov-Dec 2025 (the biggest quarter) from the edge of the data. Corrected via within-year normalization. Outside November the brand is genuinely flat (0.7&ndash;1.1&times;) thanks to constant Cassey product drops + Blogilates community demand. Plan budget + inventory heavily around November.'},
        {cls:'fr',title:'Google Ads &ne; Brand Health',text:'Google Ads = <strong>only ~11% of total revenue</strong>. Earlier Google-only analysis showed -45% YoY 2026; that\'s channel mix shift, NOT brand decline. Total brand is up double-digits. <strong>Don\'t read POPFLEX health from Google views alone</strong> &mdash; the brand is increasingly community/email/organic driven.'},
        {cls:'fg',title:'Hero Products Drive 75% of Search Revenue',text:'<strong>Pirouette Skort</strong> alone = $101k revenue at 20.7&times; ROAS from named search. <strong>Taylor Swift halo</strong> adds $41k at 27.5&times; (purple Pirouette Skort moment). <strong>Cloud Hoodie</strong> $28k. <strong>Blogilates brand search</strong> $326k at 23.9&times;. The brand has earned-media + community-driven search demand that paid ads simply harvest.'},
        {cls:'fa',title:'Counter-Cyclical Margin: Aug POAS 23&times;',text:'Aug delivers <strong>POAS 23.08&times; at 60.8% margin</strong> &mdash; the year\'s most profitable month. Low ad spend ($93k 3yr avg) + healthy demand = peak profit per dollar. Jan, Jun, Apr also POAS &gt;17&times;. Worst: <strong>Oct POAS 12.94&times; (BFCM prep) and Dec margin 48.6%</strong> (holiday discount compression).'},
        {cls:'fr',title:'Video Channel Wildly Underspent',text:'<strong>Video: $13.6k spend &rarr; $515k revenue at 37.72&times; ROAS</strong>. That\'s 4&times; the next-best channel. PMax at 13.28&times; gets $788k spend. Shopping at 3.97&times; gets $62k. Either Video budget should triple, or Video is a quirky attribution category in TW worth investigating with Jomar.'},
      ],
      MONTH_META:[
        {s:'&#10052;',a:'Hold',ac:'aho',conf:'High',note:'<strong>The post-holiday lull &mdash; shoppers have spent their gift budgets.</strong> Demand sits about 29% below an average month at $3.81M (2025), but profitability stays strong: POAS 15.45&times; and a healthy 58.9% margin. Google badly under-reports here, showing 18.1&times; vs the real 26.2&times; blended &mdash; expected, since paid ads are only ~11% of this community-driven brand. Hold spend steady; there\'s no demand to chase and the brand carries itself organically.'},
        {s:'&#128150;',a:'Hold',ac:'aho',conf:'High',note:'<strong>Still the quiet off-peak &mdash; winter is the brand\'s flattest stretch.</strong> Revenue is roughly 28% below average at $3.77M, the slimmest profit-per-dollar of the front half (POAS 12.67&times;, 58.7% margin). Google sees just 15.9&times; vs the true 21.6&times; blended, a wide under-report typical when most sales come from email and community rather than paid. Hold spend; February has no seasonal hook to lean into.'},
        {s:'&#127801;',a:'Scale',ac:'asc',conf:'High',note:'<strong>The first real spring stirring &mdash; "pilates clothes" search interest peaks this month.</strong> Demand jumps near average (only ~4% below) at $5.0M, with solid efficiency (POAS 15.11&times;, 58.7% margin). Google reads 15.8&times; against a true 25.7&times; blended, heavily under-crediting the paid layer. Scale budget modestly to ride the genuine spring lift &mdash; it\'s one of the few off-November windows where extra spend meets rising demand.'},
        {s:'&#127800;',a:'Hold',ac:'aho',conf:'High',note:'<strong>Brand search for "popflex" hits its yearly high &mdash; people are coming to find the label by name.</strong> Demand is right at average (+1%) at $4.07M, and this is one of the three most efficient months of the year (POAS 19.76&times;). Google sees only 15.1&times; vs the real 34.5&times; blended &mdash; one of the widest gaps, since this branded demand converts on its own. Hold spend; ads simply harvest interest that\'s already there.'},
        {s:'&#9728;',a:'Hold',ac:'aho',conf:'Medium',note:'<strong>Steady early-summer demand, but watch the discounting.</strong> Revenue is essentially average (-1%) at $4.18M with strong efficiency (POAS 17.72&times;), yet the 2025 discount rate spiked to about 24%, threatening the 58.0% margin. Google reports 15.7&times; against the true 30.6&times; blended, under-crediting as usual. Hold spend but cap promo depth &mdash; this is a high-POAS month worth protecting from margin erosion.'},
        {s:'&#127956;',a:'Scale',ac:'asc',conf:'High',note:'<strong>A genuine summer lift &mdash; Father\'s Day and warm-weather activewear pull demand up.</strong> This is the strongest above-average non-November month (+8%) at $4.59M, and it stays remarkably efficient (POAS 19.34&times;, 60.7% margin) even with promos running 17&ndash;25%. Google sees 15.8&times; vs the real 31.8&times; blended. Scale budget into the lift &mdash; demand and efficiency are both rising, a rare combination outside Q4.'},
        {s:'&#127754;',a:'Reduce',ac:'are',conf:'High',note:'<strong>The deep-summer trough &mdash; one of the lowest-demand months of the year.</strong> Revenue runs about 20% below average at $3.82M, and Google\'s 28.4&times; sits closest to the true 31.3&times; blended of any month (still under-reporting). The catch: July 4, 2025 was a $1M single day at 71&times; ROAS. Reduce baseline spend through the slow weeks, but plan a strong Independence Day promo &mdash; that one tentpole day carries the month.'},
        {s:'&#127881;',a:'Hold',ac:'aho',conf:'High',note:'<strong>The most profitable month of the year &mdash; quiet demand, but the highest-quality buyers.</strong> Revenue looks average (-1%) at $5.65M, yet August delivers the year\'s best POAS at 23.13&times; on a 60.8% margin, helped by the lowest discount rate of the year (5.5%). Google reads 17.4&times; vs the true 38.0&times; blended &mdash; the widest gap all year. Hold spend and protect margin; do not flood this clean month with promo.'},
        {s:'&#127794;',a:'Hold',ac:'aho',conf:'High',note:'<strong>Back-to-routine demand returns to average as Q4 prep begins.</strong> Revenue is right at average (-1%) at $3.92M with moderate efficiency (POAS 12.13&times;, 54.1% margin). Google sees 15.8&times; against the real 22.4&times; blended, under-crediting the paid contribution. Hold spend and start building November creative &mdash; the year\'s one giant month is now close, and prep beats scramble.'},
        {s:'&#127875;',a:'Build for Q4',ac:'asc',conf:'High',note:'<strong>The year\'s leanest profit month &mdash; this is BFCM acquisition season, not a demand month.</strong> Revenue sits about 23% below average at $4.73M, and POAS bottoms out at 11.28&times; as spend ramps ahead of the payoff (with discounting near 25% in 2025). Google shows 12.5&times; vs the true 20.3&times; blended. Build budget deliberately for November &mdash; the thin October return is the planned cost of seeding the brand\'s biggest month.'},
        {s:'&#127873;',a:'Max Scale',ac:'asc',conf:'High',note:'<strong>The true peak &mdash; Black Friday and Cyber Monday make this 2&times; an average month.</strong> Demand explodes about 106% above average to $9.98M in 2025 (+22% YoY, up from $8.14M in 2024), with efficiency holding at POAS 14.10&times;. Google sees just 13.1&times; vs the true 23.8&times; blended. Max scale everything &mdash; this single month dwarfs all others, so plan inventory, budget, and creative around it above all else.'},
        {s:'&#127876;',a:'Hold',ac:'aho',conf:'High',note:'<strong>The post-BFCM comedown &mdash; demand normalizes while holiday discounting compresses profit.</strong> Revenue eases to about 8% below average at $4.29M, and this is the year\'s weakest profitability: POAS 8.17&times; on a 48.6% margin (a 15% discount rate). Google reports just 8.2&times; vs the true 16.8&times; blended &mdash; the lowest Google read of the year, though still under-crediting. Hold spend; accept the planned holiday margin trade-off without expanding it.'},
      ],
      INSIGHTS:{
        opp:[
          '<strong>Triple Video budget immediately.</strong> Video at 37.72&times; ROAS on only $13.6k spend (vs PMax\'s 13.28&times; on $788k) is the biggest mispricing in the account. Either scale it 5&times; or audit what Video actually contains in TW &mdash; both outcomes are revenue-positive.',
          '<strong>Build a dedicated Pirouette Skort / Taylor Swift halo campaign.</strong> The Pirouette Skort generates $101k in named search at 20&times; ROAS. The Taylor Swift purple-skort moment added $41k at 27&times;. Combined that\'s $140k+ from one product line driven by celebrity earned media.',
          '<strong>Plan July 4 as a tentpole event.</strong> July 4 2025 was a $1M revenue day at 71&times; ROAS &mdash; mid-summer peak in a coef-0.81 month. This is a hidden mega-day. Build promo + creative around it.',
          '<strong>Move Shopping spend to PMax.</strong> Shopping campaigns at 3.97&times; ROAS vs PMax\'s 13.28&times; for the same products. ~$62k in Shopping spend would 3&times; in revenue if shifted.',
        ],
        risk:[
          '<strong>Don\'t read brand health from Google Ads alone.</strong> Google = 11% of revenue. Channel mix is shifting as brand grows organically. Reporting POPFLEX as "declining" off Google-only views is incorrect &mdash; full TW shows GROWTH.',
          '<strong>December margin compression is structural.</strong> 48.6% margin (vs 60% norm), POAS 8.17&times; (year low), 15% discount rate. This is the planned holiday acquisition trade-off. Accept it but don\'t expand it.',
          '<strong>Discount discipline weakens in spring/summer.</strong> 24% discount rate in May/Jun/Jul/Oct (2025). The high-POAS months (Mar, Apr, Aug, Jan) deserve margin protection &mdash; cap promo depth there.',
          '<strong>Negative keyword leakage.</strong> "popflexactive", "blogilates", "pop pilates clothes" still serving despite being excluded. ~$1,721 leakage. Quick audit fix.',

          '<strong>DOW is FLAT &mdash; no bid mod needed.</strong> Median revenue ranges from Mon $79k to Thu $107k (within 35%). With MER only 4.3%, DOW bid mods won\'t move the needle. Skip the exercise.',
          '<strong>TW vs Google ROAS gap averages +75%.</strong> Hits +128% in Apr, +119% in Aug. Never trust Google channel ROAS as the source of truth &mdash; use TW for all decisions.',
          '<strong>Median &gt; Mean for POPFLEX seasonality.</strong> Mean-based Nov coef = 1.88, but median = 1.10. The Black Friday week mega-days are 3&ndash;4 unique events; demand is NOT elevated all of November. Plan budget by median.',
          '<strong>Validate the Video channel with Jomar.</strong> 37.72&times; ROAS at $13k spend is either a massive opportunity or a TW attribution quirk. Find out which before scaling.',

        {cls:'fa',title:'November Is The Peak, December #2 (Corrected)',text:'<strong>Nov 2.04&times; an average month</strong> ($760k in 2025, the biggest month every year), <strong>Dec 1.68&times;</strong> ($522k, 52% margin &mdash; year-high). Both are huge holiday-gift months. An earlier version wrongly showed December as the lone peak with November understated &mdash; the detrend had edge-trimmed Nov-Dec 2025. Corrected via within-year normalization. Also a real <strong>March spike (1.25)</strong> tied to Read Across America / Dr. Seuss week.'},
        {cls:'fr',title:'Brand Defense Is 49% Of Total Revenue',text:'Top-50 search terms: <strong>96.8% is brand</strong> ("out of print" variations). Brand search alone drives 49% of TOTAL account revenue at <strong>17.11&times; ROAS</strong>. Misspelling "outofprint" delivers 34.2&times; ROAS at 49.6% CTR. <strong>Real account growth must come from non-brand demand creation</strong> (Meta, PR, influencer, organic) &mdash; not paid Google scaling.'},
        {cls:'fv',title:'May 4 2023 Was A One-Off, Not An Annual Pattern',text:'<strong>VERIFIED:</strong> May 4, 2023 hit $46,489 at 45.4&times; ROAS &mdash; but May 4, 2024 ($7,141 at 4.0&times;) and May 4, 2025 ($9,861 at 3.9&times;) were <strong>normal days</strong>. The 2023 spike was a one-time viral/promotional event (likely a Star Wars licensing drop), NOT proven annual seasonality. Worth investigating what specifically drove that day &mdash; could be replicable with a Star Wars themed launch &mdash; but DO NOT budget for it as a recurring tentpole.'},
        {cls:'fg',title:'Elite NCPA: $12&ndash;17 New Customer Acquisition',text:'New customer CPA ranges <strong>$12-17 per month</strong> (lowest in portfolio). AOV $50 = first-order ROAS of 3-4&times; just on new customers. Combined with 61% new mix (healthy LTV pattern), unit economics are exceptional for low-AOV apparel.'},
        {cls:'fr',title:'Spring March Promo Cycle Hits Margin',text:'March 2025 discount rate <strong>42.5%</strong>, March 2024 <strong>34.7%</strong>. Likely tied to "Read Across America" / Dr. Seuss literacy events. Despite heavy discounting, March 2025 revenue ($338k) was FLAT vs March 2024 ($338k). <strong>Discount-for-discount\'s-sake</strong> &mdash; same revenue at thinner margin.'},
      ],
      MONTH_META:[
        {s:'&#10052;',a:'Reduce',ac:'are',conf:'High',note:'<strong>The post-holiday hangover &mdash; the deadest month for book-themed apparel.</strong> Gift budgets are spent and demand sits about a third below the yearly average, the joint-lowest month of the year. Profit is thin (POAS 2.27&times;, 45% margin) and Google badly under-reports, showing 2.61&times; vs the real blended 5.01&times;. Pull spend back below baseline and bank it for November.'},
        {s:'&#128150;',a:'Hold',ac:'aho',conf:'High',note:'<strong>A small Valentine\'s literary-gift lift, but still a quiet month.</strong> Demand runs about 10% under the yearly average &mdash; better than January but nothing to chase. POAS is the year\'s thinnest at 2.09&times; (45% margin), and Google under-credits itself at 2.56&times; against a true blended 4.67&times;. Hold spend steady; there\'s no spike worth scaling into.'},
        {s:'&#127793;',a:'Scale',ac:'asc',conf:'High',note:'<strong>The spring spike &mdash; Read Across America / Dr. Seuss week drives a real literary surge.</strong> Demand runs about 25% above the yearly average, the third-strongest month ($338k in 2025). Blended ROAS 5.45&times; while Google shows only 3.22&times;, so the channel looks far weaker than it is. Scale into the surge &mdash; but cap discount depth, since the 42.5% promo flattened revenue at half the margin.'},
        {s:'&#127800;',a:'Hold',ac:'aho',conf:'High',note:'<strong>Post-March quiet &mdash; the spring promo is over and demand cools.</strong> Volume sits about 25% below the yearly average, but these are full-price buyers (just 8% promo, 48.6% margin) so profit per sale is strong at POAS 2.64&times;. Google under-reports at 2.83&times; vs a real blended 5.42&times;. Hold at baseline; the demand simply isn\'t there to scale.'},
        {s:'&#9728;',a:'Hold',ac:'aho',conf:'Medium',note:'<strong>A slow early-summer month with the year\'s cleanest, full-price demand.</strong> Volume runs about 21% under the yearly average, but the lowest discount rate of the year (7.5%) and 75% new customers keep it healthy. Blended ROAS 4.53&times; vs Google\'s 3.05&times;. Hold spend &mdash; and note the $46k May 4 2023 viral day did NOT repeat in 2024 or 2025, so don\'t budget for it.'},
        {s:'&#127956;',a:'Reduce',ac:'are',conf:'High',note:'<strong>The summer trough &mdash; literary apparel just isn\'t a warm-weather buy.</strong> Demand is about a third below the yearly average, tied with January for the year\'s low. Margin stays healthy at 48.5% (POAS 2.31&times;), and Google under-credits at 3.00&times; vs the true blended 4.76&times;. Reduce spend below baseline and redirect the savings toward the Q4 build.'},
        {s:'&#127754;',a:'Hold',ac:'aho',conf:'High',note:'<strong>Deep summer &mdash; soft demand but the highest-value buyers of the year.</strong> Volume runs about 18% under the yearly average, yet AOV peaks at $60 with light promo, so each order is rich (POAS 2.46&times;, 48.3% margin). Google shows 3.15&times; against a real blended 5.09&times;. Hold spend at baseline and enjoy the strong per-order economics.'},
        {s:'&#127881;',a:'Hold',ac:'aho',conf:'High',note:'<strong>Late summer is still slow, but profitability starts climbing toward Q4.</strong> Demand sits about 27% below the yearly average, yet margin is excellent at 50.9% (POAS 2.75&times;). Google under-reports at 3.03&times; vs the true blended 5.39&times;. Hold spend, and start prepping Q4 creative so the BFCM machine is ready when demand turns on.'},
        {s:'&#127794;',a:'Hold',ac:'aho',conf:'High',note:'<strong>Back-to-school and library demand begin lifting things back toward normal.</strong> Volume is about 14% under the yearly average &mdash; the strongest of the slow stretch &mdash; with the year\'s best margin at 51.3% (POAS 2.95&times;). Google shows just 2.76&times; vs a real blended 5.74&times;, the widest gap yet. Hold spend and keep building toward the Q4 surge.'},
        {s:'&#127875;',a:'Build for Q4',ac:'asc',conf:'High',note:'<strong>The pre-Q4 ramp &mdash; the calm right before the holiday storm.</strong> Demand is about 15% under the yearly average, but profitability is high (POAS 3.02&times;, 48.6% margin) and Google badly under-credits at 2.72&times; vs the true blended 6.23&times;. Build now: test BFCM creative, grow retargeting lists, and prep inventory for the two biggest months of the year.'},
        {s:'&#127873;',a:'Max Scale',ac:'asc',conf:'High',note:'<strong>The true peak &mdash; BFCM plus holiday book-gifting makes this the biggest month of the year.</strong> Demand more than doubles, running about 104% above the yearly average ($760k in 2025, +93% YoY). Blended ROAS hits 7.30&times; while Google shows only 3.60&times;, so the channel is far more profitable than it looks. Push budget to the wall &mdash; this is the month that makes the year.'},
        {s:'&#127876;',a:'Max Scale',ac:'asc',conf:'High',note:'<strong>The #2 month &mdash; holiday gifting keeps roaring through December.</strong> Demand runs about 68% above the yearly average ($522k in 2025) at the year\'s best margin of 52% (POAS 3.62&times;). Blended ROAS 6.96&times; vs Google\'s 3.13&times; &mdash; the channel is hugely under-credited. Keep budget maxed and push hard through the Dec 22 shipping deadline.'},
      ],
      INSIGHTS:{
        opp:[
          '<strong>December is the true peak (not November).</strong> Allocate Dec budget heavier than typical ecom Q4 split. 2025 Dec: $522k revenue, 6.96&times; ROAS, 52% margin. Push budget through the entire month, not just BFCM week.',
          '<strong>Investigate what drove May 4, 2023 ($46k at 45&times;).</strong> The 2023 spike did NOT repeat in 2024 or 2025 (normal days at 4&times; ROAS). Find out what specifically happened &mdash; PR drop, viral creative, licensing release &mdash; and consider TESTING a Star Wars themed promo for May 4, 2026. Don\'t budget it as recurring revenue, but it\'s a real proof-of-concept for licensed-IP tentpoles.',
          '<strong>September is undervalued.</strong> Coef 1.03 + POAS 2.95&times; + 51.3% margin. Back-to-school + library demand. Scale spend 15-20% above baseline &mdash; great efficiency without Q4 discount pressure.',
          '<strong>Brand defense is the ROAS goldmine.</strong> "out of print" search terms = 49% of TOTAL revenue at 17&times; ROAS. Search Brand campaign is currently $17k/yr &mdash; could be $25-30k at same ROAS.',
        ],
        risk:[
          '<strong>Brand-search dependency is structural risk.</strong> 49% of revenue tied to one keyword pattern. If brand awareness fades or competitor outbids, revenue collapses. <strong>Invest in non-brand demand creation</strong> (Meta, organic, influencer) to diversify.',
          '<strong>March promo cycle destroys margin without lift.</strong> 2024 + 2025 both ran 35&ndash;42% discount in March. Revenue was FLAT YoY. <strong>The promo isn\'t buying growth &mdash; it\'s just cutting margin.</strong> Test a no-promo or smaller-promo March 2026.',
          '<strong>Promo-code searchers losing money.</strong> "discount code" terms: $1,103 spend at 1.29&times; ROAS. "promo code": $792 at 0.92&times;. <strong>$1,900 of pure waste.</strong> They\'ll convert via brand anyway &mdash; add as negative keywords.',
          '<strong>"Out of print books" leakage: $2,568 at 2.6&times; ROAS.</strong> Literal book seekers click, see t-shirts, bounce. Add "books / novel / rare / first edition" negatives to filter.',
        ],
        tactic:[
          '<strong>DOW is FLAT &mdash; skip bid modifiers.</strong> Mon $5,877 to Fri $6,846 (15% range). MER is already 19% &mdash; DOW optimization won\'t move the needle. Focus energy elsewhere.',
          '<strong>TW vs Google ROAS gap averages +85%, peaks +129% in Oct.</strong> Channel-reported ROAS understates true performance by ~half. Never use Google ROAS alone for budget decisions &mdash; especially in fall.',
          '<strong>Build dedicated Monster at End / Richard Scarry PMax.</strong> IP-collection terms: $43 spend &rarr; $1,851 (43&times; ROAS) for Monster, $1,270 &rarr; $7,424 (5.85&times;) for Scarry. Tiny budget, elite returns. License-driven niches.',
          '<strong>tROAS calibration by season:</strong> Dec &rarr; 5.0&times; (push volume), Nov &rarr; 5.5&times; (BFCM concentration), Sept &rarr; 5.5&times; (efficiency), Apr-Aug margin-play &rarr; 5.0&times;, Jul (trough) &rarr; 4.5&times;.',
        ],
      },
    },
  },
