      EXEC_SUMMARY:'Edge Lifestyle is a <strong>men\'s premium athleisure brand in sustained decline</strong>. TW 3yr totals: $4.50M revenue, $1.05M spend, 4.30&times; ROAS. <strong>Account is shrinking</strong>: 2023 $2.07M &rarr; 2024 $1.64M (-21%) &rarr; 2025 $1.47M (-11%) = <strong>-29% over 2 years</strong>. ROAS improving (4.56 &rarr; 4.81&times;) on smaller scale &mdash; brand is squeezing efficiency from a shrinking base. <strong>New customer % declining</strong> (58.9% &rarr; 46.1%) and <strong>AOV rising</strong> ($127 &rarr; $140+), indicating premium repositioning at expense of acquisition volume. True seasonality: <strong>Nov (1.51) and Mar (1.49) are near-equal twin peaks</strong>; Sep (0.61) is the annual trough. <strong>UNIQUE: Google over-counts by 17&ndash;78% per month</strong> (opposite of every other brand) &mdash; PMax claims credit for retargeting that would convert anyway. <strong>"edge lifestyle" exact-match alone drives 41% of total revenue at 54&times; ROAS</strong> &mdash; extreme single-keyword concentration.',
      FINDINGS:[
        {cls:'fr',title:'Account In Sustained -29% Decline',text:'TW 3yr: <strong>2023 $2.07M &rarr; 2024 $1.64M (-21%) &rarr; 2025 $1.47M (-11%)</strong>. Spend cut even more (-33%). ROAS improved (4.56&times; &rarr; 4.81&times;) but on smaller scale &mdash; profitability optimization on a shrinking base. Google Ads showed 2025-Q4 as best Q4 ever for paid, but TW reveals total revenue declining: Google is becoming a bigger slice of a smaller pie.'},
        {cls:'fa',title:'Nov & Mar Are Near-Equal Twin Peaks',text:'Median coef <strong>Nov 1.51 vs Mar 1.49</strong>. Unusual for ecom &mdash; most have a dominant Q4 with Q1/spring far behind. Edge\'s March is structurally as strong as November. <strong>2025 Mar 22-28 week alone hit $18,421</strong> at 11-46&times; ROAS &mdash; spring promo period works.'},
        {cls:'fr',title:'UNIQUE: Google OVER-Counts By 17-78%',text:'Every other brand in this dashboard has Google UNDERCOUNTING (TW higher than Google ROAS). <strong>Edge is the opposite</strong>: TW ROAS 4.83&times; in Nov vs Google reports 22.38&times; (+78% over-count). Oct +73%, Mar +56%. Likely cause: PMax claims credit for branded retargeting clicks that would have converted via direct anyway. <strong>Don\'t use Google reports for budget decisions</strong> &mdash; the true ROAS is half of what Google shows.'},
        {cls:'fr',title:'New Customer % Collapsing',text:'2023: 58.9% new &rarr; 2024: 52.0% &rarr; 2025: 46.1%. Acquisition flow is weakening. Existing customers are doing relatively more of the work. <strong>If new-customer flow doesn\'t recover, account will continue contracting</strong> as existing base churns naturally.'},
        {cls:'fa',title:'AOV Rising While Volume Falls',text:'2023 AOV $127 &rarr; 2025 AOV $140 (Oct 2025 hit $167). Edge is pushing premium pricing &mdash; works for margin but accelerates the volume decline. Classic late-stage brand maneuver. <strong>Sustainable only if premium AOV brings premium LTV.</strong>'},
        {cls:'fv',title:'Extreme Single-Keyword Revenue Concentration',text:'<strong>"edge lifestyle" exact match drives 41% of TOTAL account revenue</strong> ($149k of $360k from one search term at 54.3&times; ROAS). Brand defense = 58.6% of revenue. Account is one keyword away from being a different business. <strong>Building a dedicated Search Brand campaign would likely improve CTR from 14% to 40%+</strong> and reduce CPC vs PMax bidding on the same term.'},
      ],
      MONTH_META:[
        {s:'&#10052;',a:'Hold',ac:'aho',conf:'High',note:'<strong>The post-holiday lull &mdash; budgets are spent and men aren\'t buying premium joggers in January.</strong> Demand runs about 7% below the yearly average ($99k in 2025). Blended ROAS is a healthy 4.59&times;, but Google over-reports as usual &mdash; claiming 6.68&times; vs the real 4.59&times; &mdash; and margin is thin (POAS just 1.15). Hold spend steady; there\'s no demand surge to chase here.'},
        {s:'&#128150;',a:'Hold',ac:'aho',conf:'High',note:'<strong>Valentine\'s gifting does little for men\'s athleisure &mdash; this isn\'t a gifted category.</strong> Demand sits slightly above average (+7%, $99k), but it\'s the weakest ROAS month of the year at 3.53&times;, and margin actually dips below break-even on ads (POAS 0.88). Google flatters itself badly, claiming 8.46&times; vs the real 3.53&times;. Hold the line and don\'t over-invest into soft profit.'},
        {s:'&#127801;',a:'Max Scale',ac:'asc',conf:'High',note:'<strong>The spring twin peak &mdash; March is structurally as strong as November for this brand.</strong> Demand runs 49% above average ($201k in 2025), with the year\'s best conversion rate (2.53%) and the biggest order count outside November. Blended ROAS is a strong 5.84&times; at solid margin (POAS 1.46); Google over-reports it as 13.36&times;. Push budget hard &mdash; this is one of only two max-scale months.'},
        {s:'&#127800;',a:'Hold',ac:'aho',conf:'High',note:'<strong>Spring demand carries over, but the March peak has passed.</strong> Demand sits 11% above average ($93k in 2025) with a healthy 4.66&times; blended ROAS and decent margin (POAS 1.17). Google over-credits itself at 6.52&times; vs the real 4.66&times;. Hold the pace set in March rather than scaling further &mdash; momentum is good but not peak-level.'},
        {s:'&#9728;',a:'Hold',ac:'aho',conf:'High',note:'<strong>An average month &mdash; Mother\'s Day does nothing for a men\'s brand.</strong> Demand sits 2% below average ($131k in 2025) at a solid 4.75&times; blended ROAS and fair margin (POAS 1.19). Google over-reports at 8.77&times; vs the real 4.75&times;. Hold spend, and remember the $35k Memorial Day 2025 spike was a one-off &mdash; do NOT bake it into recurring annual plans.'},
        {s:'&#127956;',a:'Margin Play',ac:'asc',conf:'High',note:'<strong>A quiet-demand month that pays off &mdash; Father\'s Day pulls in efficient, mostly returning buyers.</strong> Volume runs 25% below average ($116k in 2025), but blended ROAS is an above-average 6.48&times; at the year\'s strongest margin (POAS 1.62). Google over-reports at 8.27&times; vs the real 6.48&times;. With new customers at just 35.4%, retargeting wins &mdash; scale into the efficiency, not the volume.'},
        {s:'&#127754;',a:'Reduce',ac:'are',conf:'High',note:'<strong>The summer dip &mdash; athleisure shopping cools as people head outdoors.</strong> Demand drops 32% below average ($71k in 2025), the second-slowest month of the year. Blended ROAS holds at 4.86&times; with okay margin (POAS 1.22); Google over-reports at 7.17&times; vs the real 4.86&times;. Pull spend back &mdash; the demand simply isn\'t there &mdash; and bank the budget for the fall ramp.'},
        {s:'&#127811;',a:'Margin Play',ac:'asc',conf:'High',note:'<strong>The hidden efficiency window &mdash; light competition meets quiet but quality demand.</strong> Volume runs 27% below average ($108k in 2025), yet this is the year\'s best ROAS month at 6.58&times; and best margin (POAS 1.65). Google over-reports at 10.31&times; vs the real 6.58&times;. Don\'t cut &mdash; lean in at the same target ROAS to harvest the cheap, high-converting traffic.'},
        {s:'&#127794;',a:'Reduce',ac:'are',conf:'High',note:'<strong>The annual trough &mdash; the deadest month for the brand as summer ends and Q4 hasn\'t started.</strong> Demand collapses 39% below average ($68k in 2025, $55k in 2024). Blended ROAS sags to 4.15&times; with margin barely above water (POAS 1.04); Google over-reports at 8.66&times; vs the real 4.15&times;. Reduce spend ~20% below baseline &mdash; there\'s nothing to capture here.'},
        {s:'&#127875;',a:'Build for Q4',ac:'asc',conf:'High',note:'<strong>The pre-Q4 ramp &mdash; demand wakes up as shoppers begin holiday browsing.</strong> Volume jumps 15% above average ($194k in 2025) at a 4.19&times; blended ROAS, though margin is thin (POAS 1.05). Google wildly over-reports at 15.40&times; vs the real 4.19&times;. Build now &mdash; ready creative and assets for BFCM so November can capture the peak at full strength.'},
        {s:'&#127873;',a:'Max Scale',ac:'asc',conf:'High',note:'<strong>The true annual peak &mdash; BFCM drives demand 51% above average, concentrated into 3&ndash;4 mega-days.</strong> November 2025 booked $232k across 1,670 orders. Blended ROAS is 4.83&times; at fair margin (POAS 1.21). Critically, Google over-reports the most all year &mdash; claiming 22.38&times; but the real blended figure is just 4.83&times;. Max scale, but budget against the real ROAS, not Google\'s inflated number.'},
        {s:'&#127876;',a:'Hold',ac:'aho',conf:'High',note:'<strong>Post-BFCM comedown &mdash; seasonality looks average but the brand is shrinking faster than the calendar suggests.</strong> Coefficient is dead-average (+1%), yet December 2025 collapsed to $57k (vs $180k in 2023, a 68% drop). Blended ROAS is the year\'s weakest tier at 3.95&times; with margin below water (POAS 0.99); Google over-reports at 4.76&times; vs the real 3.95&times;. Hold spend and watch the decline closely.'},
      ],
      INSIGHTS:{
        opp:[

          '<strong>March is structurally a twin peak with November.</strong> Plan a March promo every year (validated across 2024, 2025, 2026 March monthly revenue at $201-225k). 2025 Mar 22-28 week proves spring promos generate BFCM-week revenue at 11-46&times; ROAS.',

        {cls:'fr',title:'Google Reports Are Misleading For This Account',text:'Google channel-reported ROAS averages 0.32-1.55&times; (looks unprofitable). TW blended shows 21-90&times; (massively profitable). <strong>Attribution gap is 4,300-10,000%</strong> &mdash; the most extreme in the portfolio. Google sees only its own direct touch, missing 95%+ of revenue from subscription auto-renews, Amazon, and direct returning customers. <strong>Don\'t use Google ROAS to make budget decisions on this account.</strong>'},
        {cls:'fa',title:'Spring 2025 New-Customer Push (Mar-May)',text:'New customer orders: Feb 8,258 &rarr; <strong>Mar 17,392 (+110%) &rarr; Apr 21,982 (+27%)</strong> &rarr; May 16,871 &rarr; Jun 11,609 (back to normal). Subscription % spiked from 2% to <strong>24% in April</strong> &mdash; massive subscriber acquisition wave. Likely combination of Amazon Big Spring Sale + email + PR. <strong>This is the playbook to repeat for spring 2026.</strong>'},

        {s:'&#10052;',a:'Hold',ac:'aho',conf:'High',note:'<strong>A normal post-holiday month for a subscription supplement brand &mdash; demand barely moves.</strong> Revenue runs about 2% below the yearly average ($1.00M) because auto-renewals keep buyers steady year-round. Blended TW ROAS is 21.58&times; at an 83.8% margin (POAS 18.09&times;), while Google reports a useless 0.32&times; &mdash; a 6,644% attribution gap, so ignore the Google view entirely. New customers are 23.8% of orders and discounting is at its yearly high (11.3%). Hold spend steady.'},
        {s:'&#128150;',a:'Hold',ac:'aho',conf:'High',note:'<strong>The quietest month, but only barely &mdash; subscriptions flatten the usual winter lull.</strong> Revenue sits roughly 6% under the yearly average ($944k), the softest reading of the year, with a mild Valentine\'s bump. Blended TW ROAS is 22.34&times; at 84.1% margin (POAS 18.80&times;); Google shows just 0.39&times; (a 5,628% gap), so TW is the only number that matters. New customers hold at 24.5%. Keep spend flat and let returning buyers carry the month.'},
        {s:'&#127801;',a:'Acquisition',ac:'asc',conf:'High',note:'<strong>Demand is flat, but this kicks off the spring new-customer surge &mdash; the best window to recruit subscribers.</strong> Revenue is about average ($1.02M), yet new orders jumped to 17,392 (+110% vs February) and new customers hit 48.7% of orders. Blended TW ROAS is 41.64&times; at 86.1% margin (POAS 35.86&times;); Google\'s 0.41&times; (a 10,056% gap, the widest of the year) badly under-credits the channel. Lean into acquisition spend at the matching 11.3% discount.'},
        {s:'&#127800;',a:'Acquisition',ac:'asc',conf:'High',note:'<strong>The single best acquisition month &mdash; spring search interest peaks and new buyers flood in cheap.</strong> Revenue is roughly 2% under average ($1.01M), but new orders peaked at 21,982 and new customers were 63.7% of all orders. Blended TW ROAS is the year\'s best at 89.98&times; with an 88.0% margin (POAS 79.15&times;); Google\'s 1.55&times; still hides a 5,705% gap. Push acquisition hard here &mdash; this is where the subscriber base gets built.'},
        {s:'&#9728;',a:'Acquisition',ac:'asc',conf:'High',note:'<strong>The tail of the spring acquisition wave &mdash; still a strong window to add new buyers.</strong> Revenue is about 2% below average ($1.02M), with 16,871 new orders and new customers at 49.1% of the total. Blended TW ROAS is 76.46&times; at a 91.1% margin (POAS 69.67&times;); Google shows 1.05&times; (a 7,182% gap), so don\'t judge the push on Google numbers. Discounting eases to 7.4%. Keep acquisition spend elevated through month-end.'},
        {s:'&#127956;',a:'Hold',ac:'aho',conf:'High',note:'<strong>Acquisition cools back to normal as the spring push winds down.</strong> Revenue runs about 5% under average ($982k), with new orders settling to 11,609 (34.8% of orders). Blended TW ROAS is 72.98&times; at a 91.6% margin (POAS 66.86&times;); Google\'s 0.89&times; understates reality by 8,100%, so stick with TW. The expensive acquisition spend is no longer justified, so return to steady-state. Hold spend.'},
        {s:'&#127754;',a:'Hold',ac:'aho',conf:'High',note:'<strong>One of the strongest revenue months &mdash; mid-summer subscription renewals lift the base.</strong> Revenue is about 2% above average and the year\'s highest at $1.14M, driven by recurring buyers rather than any demand spike. Blended TW ROAS is 67.69&times; at a 92.2% margin (POAS 62.42&times;); Google\'s 1.38&times; misses the truth by 4,805%, so don\'t act on it. New customers are back to a normal 32.5%. Maintain spend.'},
        {s:'&#127811;',a:'Hold',ac:'aho',conf:'High',note:'<strong>Among the best months &mdash; steady habitual buying with no real seasonal driver needed.</strong> Revenue sits about 2% above average ($1.14M) and margin is near its peak at 91.9% &mdash; one of the most efficient months of the year (POAS 59.79&times;). Blended TW ROAS is 65.04&times; while Google reports 1.34&times; (a 4,754% gap), so rely on TW alone. New customers are a routine 28.0%. Hold spend steady.'},
        {s:'&#127794;',a:'Hold',ac:'aho',conf:'High',note:'<strong>Slightly above-average demand from the back-to-school subscription renewal rhythm.</strong> Revenue is about 1% over average ($1.10M) at a 92.2% margin (POAS 56.01&times;). Blended TW ROAS is 60.72&times;, while Google\'s 0.99&times; under-reports by 6,033% &mdash; budget decisions must use TW, not Google. New customers fall to 19.6% as returning buyers dominate. No seasonal action needed; hold spend.'},
        {s:'&#127875;',a:'Hold',ac:'aho',conf:'High',note:'<strong>One of the top revenue months &mdash; recurring orders keep the base full with no fall spike required.</strong> Revenue runs about 5% above average ($1.14M) at the year\'s highest margin, 92.3% (POAS 57.06&times;). Blended TW ROAS is 61.84&times;, while Google\'s 0.82&times; hides a 7,441% gap, so trust TW. New customers are at their yearly low (17.2%) as the business runs on loyalty. Hold spend steady.'},
        {s:'&#127873;',a:'Hold',ac:'aho',conf:'High',note:'<strong>A solid month, but supplements do NOT see a holiday gifting spike &mdash; don\'t budget for one.</strong> Revenue is about 6% above average ($1.14M), the year\'s strongest, purely from subscription renewals, not Q4 demand. Blended TW ROAS is 56.57&times; at a 91.8% margin (POAS 51.92&times;); Google\'s 1.28&times; under-reports by 4,320%, so ignore it for budgeting. New customers stay low at 19.3%. Hold steady &mdash; no holiday scaling.'},
        {s:'&#127876;',a:'Hold',ac:'aho',conf:'High',note:'<strong>About average &mdash; a mild, immaterial year-end dip with subscriptions holding the floor.</strong> Revenue is right at the yearly average ($1.09M, still strong) at a peak 92.3% margin (POAS 49.19&times;). Blended TW ROAS is 53.32&times;, while Google\'s 0.77&times; under-credits by 6,824%, so the Google view stays irrelevant here. New customers are 20.7% and discounting is at its yearly low (5.5%). Hold spend through year-end.'},

      INSIGHTS:{
        opp:[
          '<strong>Repeat the Mar-Apr-May 2025 acquisition playbook in 2026.</strong> Brought in 50k+ new customers, spiked subscription % to 24%, all at $1-2 NCPA. Whatever combination of Amazon Big Spring Sale + email + organic drove this is repeatable.',
          '<strong>Hold the lean spend strategy.</strong> Don\'t go back to 2024\'s $60-110k/mo Google spend. The Apr 2025 cut to $11-20k/mo produced more profit. Resist pressure to scale Google &mdash; the channel is incremental at best.',
          '<strong>Build a Search Brand campaign at low budget.</strong> Brand searches ("omegavia", "omega via", product names) are the only Google traffic worth capturing. Even at low ROAS (1-4&times; Google attribution), it\'s defensive brand protection.',
          '<strong>InnovixLabs portfolio is underexploited.</strong> Sister brand has product variety (K2, D3, Magnesium, Probiotics) but minimal search demand ("innovixlabs" Trends ~0 except Apr 12.9 spike). PR or content strategy could lift this without much paid investment.',
        ],
        risk:[
          '<strong>Subscription churn is the silent risk.</strong> 80% of revenue is returning customers. If subscription churn rises (e.g., Amazon Subscribe & Save changes, customer fatigue), revenue collapses fast. Track churn rate monthly with Kristine.',
          '<strong>Amazon dependency.</strong> Most revenue likely flows through Amazon. If Amazon listings get suppressed, account loses 60%+ of revenue overnight. Diversify with Shopify/direct subscription push.',
          '<strong>The 2025 ROAS increase is partly a math artifact.</strong> Cutting spend 78% while revenue stays flat mathematically increases ROAS. Don\'t mistake this for "Google ads are working better" &mdash; they\'re less effective per dollar, just there\'s fewer dollars.',
          '<strong>March discount rate 11.3% is high.</strong> Tied to spring acquisition push. If acquisition stops, that promo cost has no ROI. Plan acquisition + promo together, never separately.',
        ],
        tactic:[
          '<strong>DOW: Sunday + Monday peak (subscription auto-renew days).</strong> Sun $35,422, Mon $33,738 (high). Fri $27,037 (low). Pattern is set by subscription billing schedules, not consumer behavior &mdash; not actionable for bid modifiers.',
          '<strong>Google attribution gap averages +6,500%.</strong> Reading Google reports for this account is actively harmful for budget decisions. Use TW only. Google should be ~5% of total revenue / less than 5% of total ad budget.',
          '<strong>tROAS targets (using TW truth):</strong> Brand search &rarr; 30&times;, NB prospecting (if any) &rarr; 5&times; (recognizing it loses on Google attribution but supports total funnel). Don\'t scale NB beyond a defensive minimum.',
          '<strong>Subscription conversion is the KPI to optimize, not order ROAS.</strong> Every new customer should go through a subscription enrollment funnel. The 2.3% subscription order rate is low &mdash; lift it via post-purchase email + Subscribe & Save promotion.',

      BUDGET_ACTIONS:['Reduce','Reduce','Hold','Hold','Hold','Hold','Hold','Hold','Scale','Max Scale','Max Scale','Max Scale'],
      EXEC_SUMMARY:'Tie Boss is the <strong>portfolio\'s explosive growth story</strong> &mdash; made-in-USA outdoor/utility hardware (rope tie-downs, Jaw Boss logging tool, kayak/Jeep hanger slings, hunting hoists). 3yr TW: $11.28M revenue, $4.67M profit, 41.4% margin, 4.43&times; ROAS. <strong>2025 was a breakout: revenue +304% YoY</strong> ($2.06M &rarr; $8.32M); November 2025 alone hit $1.66M. BUT <strong>89.6% of orders are new customers</strong> &mdash; this is a single-purchase product (you buy a tie-down once) with no LTV runway. Growth is 100% acquisition-driven, and it\'s working spectacularly. Seasonality is <strong>strongly Q4-dominant: Nov (1.62 coef) is the peak, Dec (1.53) is the #2 month, Oct (1.19) strong</strong> &mdash; driven by holiday gift-giving for outdoorsmen + hunting season hoisting. Jan-Feb is the deep winter trough (0.62-0.65). Q4 carries both peak volume AND peak margin (Nov 37%, no deep discounting &mdash; outdoor buyers pay full price). <strong>MER 22.6% &mdash; this is a paid-growth-dependent brand</strong> (unlike OmegaVia\'s organic engine). Key risk: it\'s an acquisition treadmill (same structural profile as Iron Neck) &mdash; when new-customer flow slows, revenue stops.',
      FINDINGS:[
        {cls:'fg',title:'Explosive +304% Growth In 2025',text:'TW: 2022 $1.25M &rarr; 2023 $904k (dip) &rarr; 2024 $2.06M (+127%) &rarr; <strong>2025 $8.32M (+304%)</strong>. November 2025 alone = $1.66M (vs $225k Nov 2024). Margin improved 40% &rarr; 44% while scaling. This is the single biggest growth trajectory in the portfolio.'},
        {cls:'fr',title:'89.6% New Customers = Acquisition Treadmill',text:'Single-purchase product (one tie-down lasts years). <strong>No subscription/LTV runway</strong> &mdash; same structural profile as Iron Neck. Growth requires constant new-customer flow. It\'s working brilliantly now (NCPA ~$14, stable), but the moment acquisition efficiency declines or CAC rises, revenue plateaus. Watch new-customer volume monthly as the leading indicator.'},
        {cls:'fa',title:'Strongly Q4-Dominant Seasonality',text:'Within-year normalized (2023-2025): <strong>Nov 1.62 (peak), Dec 1.53 (#2), Oct 1.19</strong>. Holiday gift-giving for the outdoorsman/hunter/trucker + hunting-season hoisting. Late summer (Aug-Sep ~1.0) is the secondary base. Jan-Feb is the deep winter trough (0.62-0.65) &mdash; nobody\'s tying down kayaks in February. <strong>Q4 is where the money is made.</strong>'},
        {cls:'fg',title:'Q4 = High Volume AND High Margin',text:'Unlike most brands that discount for volume, Tie Boss Q4 carries <strong>both peak revenue AND peak margin</strong> (Nov 37% margin, POAS 2.84&times;). Outdoor enthusiasts pay full price &mdash; the product is a gift, not a deal-shopped commodity. Only Nov discount rate elevated (13.2%, BFCM). Push Q4 hard without margin fear.'},
        {cls:'fa',title:'Healthy Non-Brand Prospecting',text:'Unusual for the portfolio: Tie Boss non-brand prospecting WORKS. PMax "Tie Down Rope" at 4.0&times;, "truck tie downs" 4.87&times;, "rope tie down" 8.18&times;. Category demand (Trends "tie down straps" peaks Jun 62.6) is being captured profitably. The product solves a real utility need with strong search intent.'},
        {cls:'fv',title:'Product Portfolio Beyond Rope',text:'Flagship 3/8" Tie Boss rope ($176k/yr, 8.9&times;) anchors, but the expansion products drive growth: <strong>Jaw Boss</strong> (logging/chainsaw, $55k 8.8&times;), <strong>Kayak Hanger Sling</strong> ($49k), <strong>Hard Top Hanger</strong> (Jeep tops), <strong>Block &amp; Tackle / Hunter\'s Special</strong> (game hoisting). Each new product opens a new outdoor niche &mdash; the growth engine.'},
      ],
      MONTH_META:[
        {s:'&#10052;',a:'Reduce',ac:'are',conf:'High',note:'<strong>The dead of winter &mdash; nobody is strapping down kayaks or hauling gear in January.</strong> Holiday spend is over and outdoor projects are on hold, so demand runs about 35% below the yearly average. Profit is healthy (46% margin, POAS 2.01&times;) but volume just isn\'t there, and Google under-reports the month (3.0&times; vs a real blended 4.4&times;). Cut spend below baseline and bank it for the Q4 peak.'},
        {s:'&#10052;',a:'Reduce',ac:'are',conf:'High',note:'<strong>The deadest month of the year for outdoor tie-downs.</strong> Mid-winter kills hauling, hunting and kayak demand, dropping revenue roughly 38% below average &mdash; the annual trough. Margin holds at 45% but POAS is the thinnest all year (1.84&times;), and Google badly under-credits itself at 2.7&times; vs a true blended 4.1&times;. Pull spend back hard and save the budget for October through December.'},
        {s:'&#127793;',a:'Hold',ac:'aho',conf:'High',note:'<strong>Spring outdoor prep starts to wake demand back up.</strong> As trucks, trailers and gear come out of storage, revenue climbs but still sits about 22% under the yearly average. Profitability is solid (43% margin, POAS 2.06&times;) and Google under-reports as usual (3.0&times; vs a real blended 4.7&times;). Hold spend at baseline &mdash; demand is recovering but not yet strong enough to scale.'},
        {s:'&#127800;',a:'Hold',ac:'aho',conf:'High',note:'<strong>Outdoor season ramps and brand search for "tie boss" peaks.</strong> Demand is still about 11% below the yearly average, so it\'s a build month, not a peak. Watch margin &mdash; it\'s the thinnest of the year at 41% as discounting creeps in, though efficiency is good (4.9&times; blended) and Google under-reports at 3.6&times;. Hold at baseline and protect margin rather than chasing volume.'},
        {s:'&#9728;',a:'Hold',ac:'aho',conf:'High',note:'<strong>Peak efficiency month &mdash; category demand for tie-down straps is climbing.</strong> Volume is moderate (about 12% below the yearly average) but every dollar works hardest here: blended ROAS hits its year-high 5.69&times; with the best POAS of the year (2.60&times;) and a strong 46% margin. Google under-reports at 3.7&times;. Hold spend &mdash; great returns, but volume doesn\'t justify scaling yet.'},
        {s:'&#127957;',a:'Hold',ac:'aho',conf:'Medium',note:'<strong>Mid-summer hauling season &mdash; category search for tie-down straps is at its yearly high.</strong> Yet Tie Boss revenue runs about 17% below its own average, hinting at a capture opportunity in truck/RV/kayak intent. Returns stay strong (5.09&times; blended, POAS 2.24&times;, 44% margin) and Google under-reports at 3.1&times;. Hold baseline spend while testing summer prospecting to close that demand gap.'},
        {s:'&#127754;',a:'Hold',ac:'aho',conf:'High',note:'<strong>Peak summer outdoor activity pulls demand up to nearly average.</strong> Revenue is only about 2% below the yearly mean as hauling, boating and camping season runs hot. Efficiency stays excellent (5.01&times; blended, POAS 2.16&times;, 43% margin) and Google continues to under-report at 3.0&times; vs the real 5.0&times;. Hold at baseline &mdash; solid month, but save the budget push for the fall ramp.'},
        {s:'&#127811;',a:'Hold',ac:'aho',conf:'High',note:'<strong>Late summer holds at an average pace as the fall season approaches.</strong> Demand is roughly 2% under the yearly mean &mdash; the steady base before the Q4 surge begins. Returns are reliable (5.06&times; blended, POAS 2.24&times;, 44% margin) and Google under-reports as it does all year (3.2&times; vs 5.1&times;). Hold spend at baseline and get ready to scale into September.'},
        {s:'&#127794;',a:'Scale',ac:'asc',conf:'High',note:'<strong>Fall ramp begins &mdash; hunting season and outdoor projects pull demand above average.</strong> Revenue runs about 3% over the yearly mean (2025 Sep hit $887k) as the Q4 build kicks off. Returns are strong (5.37&times; blended, POAS 2.45&times;, 46% margin) and Google still under-reports at 3.4&times;. Start scaling spend now to ride momentum into the peak season ahead.'},
        {s:'&#127875;',a:'Max Scale',ac:'asc',conf:'High',note:'<strong>The Q4 surge is underway &mdash; hunting-season peak meets early holiday gift demand.</strong> Demand jumps to about 19% above the yearly average (2025 Oct hit $1.17M). Returns stay healthy (5.00&times; blended, POAS 2.22&times;, 44% margin) and Google under-reports at 3.1&times; vs the real 5.0&times;. Push budget hard &mdash; this is the start of the most profitable stretch of the year.'},
        {s:'&#127873;',a:'Max Scale',ac:'asc',conf:'High',note:'<strong>The true peak &mdash; BFCM plus holiday gift-giving for outdoorsmen, hunters and truckers.</strong> Demand explodes to about 62% above the yearly average (2025 Nov hit $1.66M, the biggest month ever) and it carries the best margin of the year too (43%, POAS 2.84&times;). Blended ROAS is 5.74&times; while Google under-reports at 3.9&times;. Volume and profit peak together &mdash; spend to the wall.'},
        {s:'&#127876;',a:'Max Scale',ac:'asc',conf:'High',note:'<strong>The #2 month &mdash; peak holiday gift season for the outdoor crowd.</strong> Demand stays about 53% above the yearly average (2025 Dec hit $1.29M) as gifts for hunters, kayakers and truckers keep selling. Returns remain excellent (5.50&times; blended, POAS 2.35&times;, 43% margin) and Google under-reports at 4.0&times;. Sustain max scale through the mid-December shipping deadline, then taper.'},
      ],
      INSIGHTS:{
        opp:[
          '<strong>Capture the summer category-demand gap.</strong> Trends "tie down straps" peaks Jun-Jul (62.6) but Tie Boss revenue is mid-pack those months (coef 0.88-1.04). The category demand exists &mdash; build summer prospecting campaigns for truck/RV/kayak hauling intent.',
          '<strong>Q4 is the money window &mdash; push without margin fear.</strong> Nov-Dec carry both peak volume and peak margin (37%, no deep discounting). 2025 Q4 = $4.1M. Plan inventory + budget for an even bigger Q4 2026 given the growth trajectory.',
          '<strong>Keep expanding the product line.</strong> Each new outdoor niche product (Jaw Boss, Kayak Sling, Hard Top Hanger, Hunter\'s Special) opens a fresh acquisition pool. This is the proven growth engine &mdash; new products = new customers.',
          '<strong>Non-brand prospecting genuinely works here.</strong> 4-8&times; ROAS on category terms. Unlike most portfolio brands, scale NB confidently &mdash; the utility-product search intent converts.',
        ],
        risk:[
          '<strong>Acquisition treadmill is the existential risk.</strong> 89.6% new customers, no repeat-purchase runway. The 304% growth depends entirely on sustained new-customer flow at ~$14 NCPA. If CAC rises or acquisition saturates, growth stops abruptly (Iron Neck\'s exact trajectory). Monitor new-customer volume + NCPA monthly.',
          '<strong>MER 22.6% = paid-dependent.</strong> Unlike OmegaVia (5% MER, organic), Tie Boss needs paid ads to grow. The business is only as healthy as its ad efficiency. A platform change (iOS, PMax algo shift) could hit hard.',
          '<strong>2023 was a -27% dip year.</strong> Growth isn\'t guaranteed linear &mdash; the brand contracted in 2023 before the 2024-2025 explosion. Don\'t assume the trajectory is permanent; the category is competitive (ratchet straps, generic tie-downs).',
          '<strong>Feb + deep winter trough.</strong> Coef 0.62 (Jan 0.65). Don\'t over-spend Jan-Feb &mdash; outdoor demand genuinely isn\'t there. Pull budget forward to the Oct-Dec peak.',
        ],
        tactic:[
          '<strong>DOW: Sunday + Monday peak (weekend project planning).</strong> Sun $5,438, Mon $5,255 vs Thu $4,257. +25% weekend lift. People plan weekend hauling/hunting/outdoor projects and buy then. Consider +10% Sun-Mon bid modifier.',
          '<strong>TW vs Google gap averages +55%.</strong> Google channel ROAS ~3&times;, TW blended ~5&times;. Moderate gap (much smaller than OmegaVia\'s 6,500%). Google attribution is reasonably reliable here &mdash; but still favor TW for budget calls.',
          '<strong>tROAS by season:</strong> Oct-Dec peak &rarr; 4.0&times; (push volume), May &rarr; 5.0&times; (efficiency window), Jan-Feb trough &rarr; 5.0&times; (defensive). Don\'t throttle the Q4 peak with too-high tROAS.',
          '<strong>Seasonality is migrating Q4-ward.</strong> 2022 peaked in Aug-Sep; 2025 peaked in Nov. As gift-giving demand grows, plan for a bigger Nov-Dec each year. The Aug-Oct hunting base remains, but Q4 gift layer is the growth.',

      EXEC_SUMMARY:'LumeCube makes <strong>LED lighting for content creators</strong> &mdash; video lights, ring lights (Ring Light Pro), webcam/desk lights (Edge Light 2.0), RGB tube lights, and panel/flex products. 4yr TW: <strong>$29.1M revenue</strong> (2022 $7.54M &rarr; 2023 $8.44M &rarr; 2024 $7.03M &rarr; 2025 $6.13M), ~36% net margin, blended ROAS ~3.4&times;. Seasonality is <strong>strongly Q4-dominant and rock-solid: November is the peak in EVERY one of the 4 years</strong> (1.73 coef), December the #2 month (1.26), with a January secondary bump (1.11, the new-year creator-gear wave) &mdash; all driven by holiday gifting of cameras/creator kits + content-creation New Year\'s resolutions. The deep trough is <strong>July (0.75)</strong>, the summer lull. This pattern is confirmed across THREE independent sources: TW blended sales (4yr), Google Ads channel (5yr), and Google Trends (brand + 4 category terms all peak Nov). <strong>82.4% of orders are new customers</strong> &mdash; an acquisition-heavy profile (like Iron Neck / Tie Boss) with limited repeat runway. <strong>The real story is structural decline</strong>: revenue is down ~19% off the 2022/2023 peak with net margin compressing 45%&rarr;31% on flat ~$1.8M ad spend &mdash; the seasonality is healthy but the business is shrinking underneath it. January is the most <em>profitable</em> month (POAS 4.27&times;, 41% margin, cheapest acquisition at $44 NCPA).',
      FINDINGS:[
        {cls:'fa',title:'November Peak &mdash; Confirmed 3 Ways, Every Year',text:'TW blended total_sales peaks in <strong>November all 4 years</strong> (2022 $1.54M, 2023 $1.15M, 2024 $784k, 2025 $760k). Coef 1.73 (Dec 1.26 #2, Jan 1.11 bump). The Google Ads channel (5yr) and Google Trends (brand "lume cube" Nov 1.29, "led video light" Nov 1.75, "video light" Nov 1.41) independently agree. <strong>This is the highest-confidence seasonality read in the portfolio</strong> &mdash; holiday gifting of creator gear + Q4 content push.'},
        {cls:'fr',title:'The Oct-2022 $1.9M Pixel Artifact',text:'Google Ads reported a <strong>$1,913,534 conversion value in Oct 2022 at 22&times; ROAS</strong> &mdash; ~5&times; any other month. TW total_sales that month was a <strong>normal $676,676</strong>, proving it was a Google pixel over-count, not real revenue. Left uncorrected, it falsely flagged October as the peak. Removed from all seasonality math. Lesson: always cross-check channel-reported value against TW blended.'},
        {cls:'fr',title:'Structural Decline Underneath Healthy Seasonality',text:'Revenue: 2023 $8.44M &rarr; <strong>2024 -16.7% &rarr; 2025 -12.8%</strong> (~19% off peak). Net margin compressing <strong>45% &rarr; 31%</strong> while ad spend stays flat at ~$1.8M &mdash; efficiency erosion. The seasonal SHAPE is reliable, but plan off a shrinking base. This is a brand-health conversation for Jomar, separate from the seasonality calendar.'},
        {cls:'fa',title:'January Is The Profit Month',text:'<strong>POAS peaks in January (4.27&times;)</strong> with 41% net margin and the cheapest new-customer acquisition of the year ($44 NCPA vs $77 in summer). The Jan creator-gear bump (new-year content resolutions, gift-card redemption) converts efficiently. Don\'t pull budget after Christmas &mdash; January is the highest-return window outside Q4 volume.'},
        {cls:'fv',title:'82.4% New Customers = Acquisition Treadmill',text:'Like Iron Neck and Tie Boss, LumeCube is <strong>acquisition-dependent</strong> (82.4% new buyers, stable ~74-87% all months). A LED light is a durable, infrequent purchase &mdash; limited repeat/LTV runway. Combined with the revenue decline, this means growth requires either new products (Nano/Micro entry SKUs, new colorways) or improved acquisition efficiency. Monitor new-customer volume + NCPA as the leading indicators.'},
        {cls:'fg',title:'Brand Dominates; Ring Light + Desk Lamp Are The NB Battlegrounds',text:'Among top search terms, <strong>brand = 91% of value at 10.7&times; ROAS</strong> ("lume cube" exact 9.6&times;, "lumecube" phrase 21&times;). Non-brand category demand worth pursuing: <strong>"ring light" / "ring light with stand"</strong> (3-4&times;, Ring Light Pro), <strong>"desk lamp"</strong> (2.5&times;, Edge Light 2.0), <strong>"tube lights"</strong> (8.3&times;). These category terms peak Nov-Dec in Trends &mdash; align NB push with the Q4 demand wave.'},

      MONTH_META:[
        {s:'&#10052;',a:'Scale',ac:'asc',conf:'High',note:'<strong>The new-year creator-gear wave &mdash; and the single most profitable month of the year.</strong> Resolutions to start making content plus gift-card redemption push demand ~11% above the yearly average. Profit is the best all year (41% margin, POAS 4.27&times;), and blended ROAS runs 3.57&times; vs Google\'s under-reported 2.78&times;. New customers are the cheapest of the year to acquire ($44 NCPA). Don\'t cut after Christmas &mdash; scale into the most efficient window of the year.'},
        {s:'&#10052;',a:'Hold',ac:'aho',conf:'High',note:'<strong>The January creator surge cools back to normal.</strong> Demand settles to roughly the yearly average (~2% below), a healthy post-bump normalization rather than weakness. Profit stays strong (39% margin, POAS 3.64&times;) and blended ROAS holds at 3.04&times; against Google\'s under-reported 2.36&times;. Nothing here calls for a move &mdash; hold spend at baseline.'},
        {s:'&#127793;',a:'Hold',ac:'aho',conf:'Medium',note:'<strong>A steady, middle-of-the-road month before spring softens.</strong> Demand sits right at the yearly average (~2% above), so volume is fine but unremarkable. Margin eases to 36% and POAS to 2.72&times;, while blended ROAS is healthy at 3.62&times; vs Google\'s under-reported 2.97&times;. No seasonal pull in either direction &mdash; hold at baseline.'},
        {s:'&#127800;',a:'Reduce',ac:'are',conf:'High',note:'<strong>Spring softening hits, and it\'s the worst efficiency month of the year.</strong> Creator-gear demand drops ~18% below average while acquisition gets expensive &mdash; new customers cost $114, the priciest of the year. Profit bottoms out (30% margin, POAS 2.17&times;) and blended ROAS slips to 2.93&times; vs Google\'s under-reported 2.64&times;. Pull spend back &mdash; this is the least productive dollar all year.'},
        {s:'&#9728;',a:'Reduce',ac:'are',conf:'High',note:'<strong>The summer lull begins as content creators step away from gear buying.</strong> Demand runs ~18% below the yearly average. Profitability is thin (POAS 2.40&times;), though blended ROAS holds up at 3.48&times; against Google\'s under-reported 2.56&times;. Below-average demand with weak margins &mdash; reduce spend versus baseline and start banking budget for Q4.'},
        {s:'&#127958;',a:'Reduce',ac:'are',conf:'High',note:'<strong>Deep summer &mdash; creators are filming outdoors, not buying lights.</strong> Demand falls ~23% below average and discounting starts creeping up (10.6%) to move volume. Blended ROAS still looks fine at 3.41&times; (Google under-reports at 2.54&times;), but POAS is just 2.71&times; and the volume simply isn\'t there. Conserve budget and save it for the November peak.'},
        {s:'&#127754;',a:'Reduce',ac:'are',conf:'High',note:'<strong>The deepest trough of the year &mdash; the peak of the summer creator-gear lull.</strong> Demand bottoms at ~26% below average and discounting runs heaviest (13.1%), crushing margin to its year-low 25.7%. POAS is 2.48&times; with new customers at $98, and blended ROAS dips to 3.05&times; vs Google\'s under-reported 2.50&times;. Cut spend hard and bank every dollar for November.'},
        {s:'&#127811;',a:'Hold',ac:'aho',conf:'High',note:'<strong>Demand reawakens as creators rebuild kits ahead of fall content season.</strong> Volume is still ~13% below average but climbing, and this is the best summer margin (34.2%) with POAS recovering to 2.97&times;. Blended ROAS is the strongest of the summer at 3.63&times; against Google\'s under-reported 2.93&times;. Hold at baseline and begin preparing Q4 creative and assets.'},
        {s:'&#127809;',a:'Hold',ac:'aho',conf:'High',note:'<strong>Back-to-content season builds as creators gear up for the fall push.</strong> Demand is ~7% below average but trending up month over month. POAS sits at 2.95&times; and blended ROAS at 3.30&times; vs Google\'s under-reported 2.73&times; &mdash; solid, improving footing. Hold spend and pre-build the Q4 ramp so November is fully loaded.'},
        {s:'&#127875;',a:'Scale',ac:'asc',conf:'High',note:'<strong>The Q4 ramp begins as early holiday and gifting demand wakes up.</strong> Volume is still ~7% under average, but shoppers buy bigger &mdash; AOV peaks at $251 and POAS is a healthy 2.91&times;. Blended ROAS runs 3.49&times; against Google\'s under-reported 2.93&times;. Start scaling budget and load creative now to carry momentum straight into the November peak.'},
        {s:'&#127873;',a:'Max Scale',ac:'asc',conf:'High',note:'<strong>The true peak &mdash; the biggest month every single year on holiday gifting of cameras and creator kits.</strong> BFCM drives demand ~73% above the yearly average ($760k in 2025, $1.54M back in 2022). POAS is strong at 3.36&times; with AOV peaking at $264, and blended ROAS hits 3.69&times; vs Google\'s under-reported 3.25&times;. Category terms like ring light and video light peak in Trends now &mdash; push budget to the wall.'},
        {s:'&#127876;',a:'Max Scale',ac:'asc',conf:'High',note:'<strong>The #2 month &mdash; holiday gift season for content creators stays in full swing.</strong> Demand runs ~26% above average ($678k in 2025), with discounting peaking at 16% on holiday promos. POAS holds at 3.32&times; on a 38% seasonal margin, and blended ROAS is the year\'s best at 3.75&times; against Google\'s under-reported 2.84&times;. Sustain max scale through the mid-December shipping cutoff.'},
      ],
      INSIGHTS:{
        opp:[
          '<strong>January is an under-appreciated profit window.</strong> POAS 4.27&times;, 41% margin, $44 NCPA &mdash; the most efficient month of the year. The standard instinct to slash budget after Christmas is wrong here; the new-year creator-gear bump converts cheaply. Hold or scale Jan, don\'t cut.',
          '<strong>Q4 is the volume + AOV engine &mdash; plan inventory and budget aggressively.</strong> Nov-Dec carry peak revenue (coef 1.73/1.26) and peak AOV ($264/$242). Align the non-brand category push (ring light, desk lamp, tube lights &mdash; all Trends-peak Nov-Dec) with the Q4 wave to capture gifting demand beyond brand search.',
          '<strong>New entry-price products are the decline antidote.</strong> 82.4% new-customer dependence + a shrinking base means growth needs fresh acquisition pools. Lower-price SKUs and new colorways/launches reset the new-customer funnel &mdash; the same playbook that works for the acquisition-treadmill brands.',
          '<strong>Pull summer budget forward to Q4.</strong> Apr-Jul (coef 0.75-0.82) is both low-demand AND low-margin (25-30%, NCPA up to $114). Every dollar saved in the spring/summer trough is worth far more deployed in November.',
        ],
        risk:[
          '<strong>Structural revenue decline is the headline risk.</strong> -16.7% (2024) then -12.8% (2025), margin 45%&rarr;31% on flat spend. Seasonality tells you WHEN to spend; it doesn\'t fix a shrinking base. This needs a brand-level strategy conversation (product, positioning, channel mix) with Jomar &mdash; not just calendar optimization.',
          '<strong>Acquisition treadmill.</strong> 82.4% new customers, durable infrequent product = no LTV cushion. When new-customer flow slows (and it is &mdash; revenue is falling), there\'s no repeat base to backstop it. Monitor monthly new-customer volume + NCPA as the true leading indicator.',
          '<strong>Don\'t trust Google-channel conversion value in isolation.</strong> The Oct-2022 $1.9M phantom proves the pixel can wildly over-report. Always validate against TW blended total_sales before making budget or seasonality calls. Google currently UNDER-reports by ~25-30% (2025), but it has over-reported catastrophically before.',
          '<strong>Spring is a profitability trap.</strong> April is the worst month (POAS 2.17&times;, 30% margin, $114 NCPA) yet sits right after the profitable Jan-Mar window &mdash; easy to over-spend on momentum. Cut hard Apr-Jul.',
        ],
        tactic:[
          '<strong>DOW: weekday brand, weekend-weak.</strong> Mon-Fri index ~1.05-1.09, Sat 0.84 / Sun 0.86. The professional/creator buyer purchases on workdays. Consider -10-15% weekend bid modifier and concentrate budget Mon-Fri.',
          '<strong>TW vs Google gap ~25-30% (2025).</strong> Blended ROAS ~3.4&times; vs Google-reported ~2.7&times;. Moderate, reliable gap &mdash; favor TW blended for budget decisions but Google attribution is directionally usable for in-platform optimization.',
          '<strong>tROAS by season:</strong> Nov-Dec peak &rarr; lower tROAS to capture volume; Jan &rarr; lean in (best efficiency); Apr-Jul trough &rarr; raise tROAS defensively (don\'t chase low-margin summer volume).',
          '<strong>Non-brand should ride the Q4 calendar.</strong> Category terms (ring light, video light, desk lamp, tube lights) peak Nov-Dec in Trends. Scale NB prospecting into Q4 when category demand is highest and AOV peaks; throttle it in the summer trough.',
        ],
      },
    },
  },

      BUDGET_ACTIONS:['Hold','Hold','Hold','Reduce','Reduce','Reduce','Reduce','Reduce','Hold','Scale','Max Scale','Max Scale'],
      EXEC_SUMMARY:'Ilios "Lighting" is actually a <strong>premium lighted/magnifying makeup-mirror brand</strong> (Beauty Ring mirrors, Slim Rechargeable, 5x Deluxe Magnifying, vanity sets) for <strong>women 45+</strong> &mdash; the buyer is Female-dominant (6.8&times; ROAS), ages 45-65+, mobile, sunbelt-skewed (FL/TX/CA). It is <strong>organic-dominant like OmegaVia</strong>: 2022 did $812k in total sales with $0 tracked ad spend, and 2025 MER is only ~16%, so ~84% of revenue is organic/repeat. 4yr TW total_sales: 2022 $812k &rarr; 2023 $791k &rarr; <strong>2024 $1.46M (+84%)</strong> &rarr; 2025 $1.21M (-17%). Seasonality is <strong>Q4-dominant and triple-confirmed</strong> (TW revenue, TW orders, and Google Trends all peak December): <strong>Dec (1.69 coef) is the peak, Nov (1.43) #2</strong>, a modest Jan-Mar elevation (post-holiday + Valentine\'s + spring refresh), and a <strong>deep May-Aug trough (Jun 0.69 the low)</strong> &mdash; classic beauty-gifting seasonality. <strong>Two honest caveats:</strong> (1) the brand is a <strong>heavy, lumpy discounter</strong> (35-49% off in 2022-24, pulled back to &lt;10% in H2 2025) and the <strong>2024 Q1 was a one-off promo/PR surge</strong> (March hit 2,145 orders vs ~250-900 normal) &mdash; neutralized via median+orders; (2) the <strong>Google Ads account was near-dormant until Feb 2025 then scaled</strong>, so 2025\'s Jan-Feb efficiency metrics (ROAS, MER, NCPA) are pre-ramp and not representative &mdash; the seasonality coefficient is built from 4 years of spend-independent TW demand, NOT the ramp. 83.7% new customers (acquisition-heavy with an organic base).',
      FINDINGS:[
        {cls:'fa',title:'December Peak &mdash; Confirmed 3 Ways',text:'TW revenue, TW orders, AND Google Trends all peak in <strong>December</strong> (coef 1.69), with <strong>November #2</strong> (1.43). The two clean recent years (2023, 2025) both peak Q4 in revenue and orders. Holiday gifting of premium vanity/makeup mirrors. <strong>Deep May-Aug trough</strong> (Jun 0.69) &mdash; discretionary beauty/gift demand collapses in summer (sales drop harder than search interest does).'},
        {cls:'fv',title:'Organic-Dominant Business (~84%)',text:'2022 generated <strong>$812k in total sales with $0 tracked ad spend</strong>; 2025 MER is only ~16%. Google Ads is a small slice of a largely organic/repeat brand &mdash; closest portfolio analog is OmegaVia. <strong>Implication:</strong> paid ROAS understates true contribution, and blended ROAS is high (Q4 8-10&times;) because organic revenue dwarfs ad spend. Don\'t over-credit or over-cut paid based on platform ROAS alone.'},
        {cls:'fr',title:'2024 Q1 Was A One-Off Promo/PR Surge',text:'Jan-Mar 2024 orders exploded (<strong>March 2,145 orders vs ~250-900 normal</strong>; single day 2024-02-29 = $98,553). This drove the +84% 2024 year &mdash; then 2025 fell -17%. It is <strong>NOT recurring seasonality</strong>; it was a deep-discount + PR/viral event. Neutralized in the coefficient via median + order-count. Don\'t plan a repeat Q1 spike unless a similar promo/PR push is scheduled.'},
        {cls:'fr',title:'Heavy, Lumpy Discounter',text:'Discounts ran <strong>35-49% of gross in 2022-2024</strong>, then pulled back to &lt;10% in H2 2025 (Nov 9%, Dec 8%) &mdash; and 2025 still delivered its best-ever Q4. Revenue spikes historically followed <strong>sale timing</strong>, not pure demand, which is why the coefficient leans on orders + Trends (cleaner demand) over raw revenue. The 2025 margin-led Q4 (low discount, high revenue) is the healthier model to repeat.'},
        {cls:'fg',title:'Brand Search Is Gold; NB Category Is The Battleground',text:'TTM search: <strong>brand = 82% of value at 24.6&times; ROAS</strong> ("ilios mirror" 24&times;, "ilios lighting" 28&times;). Non-brand 9.2&times;. NB category terms ("best makeup mirror", "lighted makeup mirror", "makeup mirror with lights") run 3-6&times; &mdash; the real prospecting battleground. They also bid efficiently on <strong>competitor/celebrity terms</strong> (simplehuman, conair, "kim kardashian makeup mirror").'},
        {cls:'fv',title:'Account Scaled Feb 2025 &mdash; 2025 Is The Ramp Year',text:'Google Ads was near-dormant ($23-195/mo) until <strong>Feb 2025</strong>, then scaled to $2-5k/mo, and 2026 is ~2-3&times; more efficient than 2025 at similar spend (still maturing). So 2025\'s Jan-Feb ROAS/MER/NCPA are pre-ramp artifacts (Jan blended ROAS shown capped). The seasonality is built from 4 years of <strong>spend-independent TW demand</strong>, so it\'s insulated from the ramp.'},

      MONTH_META:[
        {s:'&#10052;',a:'Hold',ac:'aho',conf:'Medium',note:'<strong>The post-holiday comedown for a gifting-driven mirror brand.</strong> January sits just below the yearly average (about 4% under) as gifting demand cools, but margin is one of the strongest all year at 40%. Blended ROAS reads 11.0&times; vs Google\'s 4.4&times; &mdash; Google badly under-reports here, though 2025 Jan was pre-ramp (only $980 spend) so the efficiency numbers aren\'t fully representative. Hold spend near baseline.'},
        {s:'&#128150;',a:'Hold',ac:'aho',conf:'Medium',note:'<strong>Valentine\'s gifting and a winter beauty refresh give February a small lift.</strong> Demand runs about 4% above the yearly average, and this is the single best margin month at 42%. Blended ROAS of 11.2&times; towers over Google\'s reported 3.8&times;, so Google heavily under-credits the channel &mdash; but 2025 Feb was early-ramp, so read efficiency with caution. Hold near baseline.'},
        {s:'&#127800;',a:'Hold',ac:'aho',conf:'Low',note:'<strong>A genuine spring beauty-refresh bump &mdash; the year\'s highest non-Q4 demand.</strong> Demand runs about 9% above average, but be careful: 2024\'s huge March was a one-off 2,145-order promo/PR surge, not recurring seasonality. Blended ROAS is 4.9&times; vs Google\'s 2.4&times; (Google under-reports). Hold, and only scale slightly if real-time demand confirms &mdash; do not plan a repeat of the 2024 spike.'},
        {s:'&#127807;',a:'Reduce',ac:'are',conf:'High',note:'<strong>The spring softening begins as discretionary mirror demand fades.</strong> April runs roughly 23% below the yearly average as the slow summer stretch starts to set in. Blended ROAS holds at 4.5&times; while Google reports just 3.0&times; (Google under-reports), but margin slips to 30% and POAS falls to 1.36. Below-average demand month &mdash; reduce spend versus baseline and bank it for Q4.'},
        {s:'&#9728;',a:'Reduce',ac:'are',conf:'High',note:'<strong>The summer lull deepens &mdash; beauty and gifting demand both quiet down.</strong> May sits about 24% under the yearly average, with both search interest and sales weak (and the lowest month-to-month variance of the year, so this is reliable). Blended ROAS is 3.9&times; vs Google\'s 2.7&times;, but POAS dips to just 1.08 on a 28% margin. Pull spend back and conserve for the Q4 wave.'},
        {s:'&#127958;',a:'Reduce',ac:'are',conf:'High',note:'<strong>The deepest trough of the year &mdash; discretionary beauty and gift demand bottoms out in deep summer.</strong> June runs about 31% below the yearly average, the lowest of all twelve months. Blended ROAS is 3.6&times; against Google\'s 2.6&times; (Google under-reports), but margin is thin at 27%, POAS just 0.98, and new-customer cost peaks at $78. Keep spend minimal and save budget for the holiday peak.'},
        {s:'&#127754;',a:'Reduce',ac:'are',conf:'High',note:'<strong>Mid-summer stays in the demand desert &mdash; no seasonal driver for vanity mirrors.</strong> Demand sits about 21% below the yearly average. In 2025 this was the heaviest spend month ($40k) at the worst ROAS (3.4&times;) and thinnest margin (20%) with POAS of just 0.68 &mdash; classic ramp-year over-spend. Blended 3.4&times; still beats Google\'s 2.8&times;. Don\'t repeat the over-spend &mdash; keep summer lean.'},
        {s:'&#127811;',a:'Reduce',ac:'are',conf:'Medium',note:'<strong>Late summer is still below par as buyers haven\'t returned to vanity/gifting.</strong> August runs about 25% under the yearly average. Blended ROAS recovers to 4.2&times; vs Google\'s 2.7&times; (Google under-reports), and margin steadies at 27%. Hold spend low while the trough finishes &mdash; and start prepping the Q4 holiday creative and assets now.'},
        {s:'&#127809;',a:'Hold',ac:'aho',conf:'Medium',note:'<strong>Demand starts reawakening as fall approaches and gift-planning stirs.</strong> September is still about 20% below the yearly average, so it\'s a transition month, not a scaling one yet. Blended ROAS is 4.1&times; vs Google\'s 3.0&times; (Google under-reports) on a 26% margin. Hold spend and use the month to build out the Q4 ramp &mdash; the gifting season is close.'},
        {s:'&#127875;',a:'Scale',ac:'asc',conf:'High',note:'<strong>The Q4 ramp begins &mdash; holiday gifting demand starts to awaken.</strong> Headline demand is still about 19% under average, but efficiency turns sharply: blended ROAS jumps to 6.2&times; vs Google\'s 4.3&times; (Google under-reports), margin climbs to 30%, and AOV holds strong. Start scaling budget and load the holiday assets so you\'re positioned ahead of the November surge.'},
        {s:'&#127873;',a:'Max Scale',ac:'asc',conf:'High',note:'<strong>The #2 month of the year &mdash; BFCM gifting drives premium mirror sales hard.</strong> Demand runs about 43% above the yearly average. In 2025, November hit $164k on 913 orders at just a 9% discount &mdash; the healthy, margin-led model. Blended ROAS of 8.3&times; far exceeds Google\'s 4.7&times; (Google under-reports), with POAS 2.9&times; and 35% margin. Push budget hard.'},
        {s:'&#127881;',a:'Max Scale',ac:'asc',conf:'High',note:'<strong>The true peak &mdash; December holiday gifting of vanity and makeup mirrors is the whole game.</strong> Demand runs about 69% above the yearly average. In 2025, December hit $194k on 1,032 orders at just an 8% discount. Volume, margin (41%) and efficiency all peak together: blended ROAS 9.98&times; vs Google\'s 5.2&times; (Google under-reports) and POAS 4.09&times;. Max scale through the mid-December shipping cutoff.'},
      ],
      INSIGHTS:{
        opp:[
          '<strong>Q4 is the whole game &mdash; plan budget + inventory aggressively for Nov-Dec.</strong> Dec (1.69) and Nov (1.43) are the peak, triple-confirmed. 2025 proved Ilios can win Q4 at &lt;10% discount (vs 35-49% historically) &mdash; repeat the margin-led playbook: scale paid + brand defense into the gifting wave, not deep discounts.',
          '<strong>Lean into brand search &mdash; it\'s 82% of value at 24.6&times;.</strong> "ilios mirror/lighting/makeup mirror" convert at 24-28&times;. Protect and fully fund brand campaigns, especially in Q4 when brand-search gifting intent surges. Cheap, dominant ROI.',
          '<strong>Build non-brand category capture for Q4.</strong> "best makeup mirror", "lighted makeup mirror", "makeup mirror with lights" run 3-6&times; and category Trends peak Nov-Dec. The account only scaled in 2025 &mdash; there\'s untapped NB headroom to capture gifting demand beyond brand.',
          '<strong>Mine the organic base.</strong> ~84% of revenue is organic/repeat. Email/retention around the Dec peak + a Valentine\'s/spring (Feb-Mar) secondary push aligns paid with the natural demand curve and the loyal 45+ base.',

function fmtK(n){if(n>=1000000)return'$'+(n/1000000).toFixed(2)+'M';return'$'+Math.round(n/1000)+'k';}
function rgb(hex){const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return r+','+g+','+b;}

// =============================================================
// BRAND THEME (CSS variable swap)
// =============================================================
function applyTheme(brand){
  const r = document.documentElement;
  r.style.setProperty('--accent', brand.accent);
  r.style.setProperty('--accent2', brand.accent2);
  r.style.setProperty('--accent3', brand.accent3);
  const rgbVal = rgb(brand.accent);
  r.style.setProperty('--border', `rgba(${rgbVal},.10)`);
  r.style.setProperty('--border2', `rgba(${rgbVal},.22)`);
  document.body.style.backgroundImage = `radial-gradient(ellipse at top, rgba(${rgbVal},.04) 0%, transparent 55%)`;
  document.title = brand.name + ' — Seasonality Intelligence';
}

// =============================================================
// BRAND DROPDOWN
// =============================================================
function renderTabs(){
  const btn = document.getElementById('brandDdBtn');
  const label = document.getElementById('brandDdLabel');
  const menu = document.getElementById('brandDdMenu');
  const active = BRANDS[activeBrand];
  label.textContent = active ? active.name : 'Select Brand';
  menu.innerHTML = '';
  BRAND_ORDER.forEach(slug => {
    const b = BRANDS[slug];
    const isActive = slug === activeBrand;
    const isPending = !b.ready;
    const cls = ['bs-dd-item', isActive?'active':'', isPending?'pending':''].filter(Boolean).join(' ');
    menu.innerHTML += `<button class="${cls}" data-slug="${slug}" type="button"><span class="dot"></span>${b.name}${isPending?' &middot; pending':''}</button>`;
  });
  menu.querySelectorAll('button').forEach(item => {
    item.addEventListener('click', () => {
      setBrand(item.dataset.slug);
      menu.classList.remove('open');
      btn.classList.remove('open');
    });
  });
  // toggle handler (bind once)
  if(!btn.dataset.bound){
    btn.dataset.bound = '1';
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      menu.classList.toggle('open');
      btn.classList.toggle('open');
    });
    document.addEventListener('click', (e) => {
      if(!document.getElementById('brandDropdown').contains(e.target)){
        menu.classList.remove('open');
        btn.classList.remove('open');
      }
    });
    document.addEventListener('keydown', (e) => {
      if(e.key === 'Escape'){ menu.classList.remove('open'); btn.classList.remove('open'); }
    });
  }
}

function buildHeatmap(d){
  const wrap = document.getElementById('heatmap');
  const maxC = Math.max(...d.COEFF), minC = Math.min(...d.COEFF);
  const span = maxC - minC;
  wrap.innerHTML = MONTHS.map((m,i) => {
    const c = d.COEFF[i];
    const pct = ((c-minC)/span*100).toFixed(0);
    const pin = c===maxC?'<div class="star">&#9733;</div>':c===minC?'<div class="star">!</div>':'';
    const [dl] = dLabel(c);
    return `<div class="hm-cell ${cBg(c)}">${pin}<div class="hm-month">${m}</div><div class="hm-coeff">${c.toFixed(3)}</div><div class="hm-label">${dl}</div><div class="hm-bar"><div class="hm-fill" style="width:${pct}%"></div></div></div>`;
  }).join('');
}

function buildDowGrid(d){
  const grid = document.getElementById('dowGrid');
  const maxRev = Math.max(...d.DOW.map(x => x.rev));
  // Color DOW relative to this brand's own ROAS range (top tertile = green, middle = mid, bottom = amber)
  const roasVals = d.DOW.map(x => x.roas);
  const rMax = Math.max(...roasVals), rMin = Math.min(...roasVals);
  const rT1 = rMin + (rMax-rMin) * 2/3;
  const rT2 = rMin + (rMax-rMin) * 1/3;
  grid.innerHTML = d.DOW.map(x => {
    const col = x.roas >= rT1 ? '#10b981' : x.roas >= rT2 ? '#22c55e' : '#f59e0b';
    const pct = (x.rev/maxRev*100).toFixed(0);
    return `<div class="dow-cell" style="border-color:${col}30">
      <div class="dow-day" style="color:${col}">${x.d}</div>
      <div class="dow-rev">$${(x.rev/1000).toFixed(1)}k</div>
      <div class="dow-roas" style="color:${col}">${x.roas.toFixed(2)}&times;</div>
      <div class="hm-bar" style="margin-top:8px"><div class="hm-fill" style="width:${pct}%;background:${col}"></div></div>
    </div>`;
  }).join('');
}

  // 7. YoY ROAS
  chartInstances.yoyRoas = new Chart(document.getElementById('yoyRoasChart'),{type:'line',data:{labels:MONTHS,datasets:[
    {label:'2024',data:d.ROAS_2024,borderColor:'rgba(99,102,241,.9)',pointRadius:4,borderWidth:2.5,tension:0.4},
    {label:'2025',data:d.ROAS_2025,borderColor:'rgba(16,185,129,.9)',pointRadius:4,borderWidth:2.5,tension:0.4},
    {label:'2026 (partial)',data:d.ROAS_2026,borderColor:accent,backgroundColor:`rgba(${accentRgb},.06)`,pointRadius:6,borderWidth:3,tension:0.4,borderDash:[6,3]}
  ]},options:{responsive:true,maintainAspectRatio:false,scales:{x:{grid:GL,ticks:TK},y:{grid:GL,ticks:{...TK,callback:v=>v+'x'},min:0}}}});

  // 8. Attribution Gap
  chartInstances.attrGap = new Chart(document.getElementById('attrGapChart'),{type:'bar',data:{labels:MONTHS,datasets:[
    {label:'TW Blended ROAS',data:d.ROAS,backgroundColor:`rgba(${accentRgb},.55)`,borderColor:accent,borderWidth:1.5,borderRadius:4},
    {label:'Google Channel ROAS',data:d.CH_ROAS,backgroundColor:'rgba(59,130,246,.45)',borderColor:'#3b82f6',borderWidth:1.5,borderRadius:4}
  ]},options:{responsive:true,maintainAspectRatio:false,scales:{x:{grid:GL,ticks:TK},y:{grid:GL,ticks:{...TK,callback:v=>v+'x'},min:0}}}});

  // 9. Gap %
  chartInstances.gapPct = new Chart(document.getElementById('gapPctChart'),{type:'bar',data:{labels:MONTHS,datasets:[{label:'Attribution Gap %',data:d.GAP,backgroundColor:d.GAP.map(v=>v>30?'rgba(16,185,129,.6)':v>0?'rgba(34,197,94,.45)':'rgba(239,68,68,.55)'),borderColor:d.GAP.map(v=>v>30?'#10b981':v>0?'#22c55e':'#ef4444'),borderWidth:1.5,borderRadius:4}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{grid:GL,ticks:TK},y:{grid:GL,ticks:{...TK,callback:v=>v+'%'}}}}});

  // 10. New Customer
  chartInstances.newCust = new Chart(document.getElementById('newCustChart'),{type:'bar',data:{labels:MONTHS,datasets:[{label:'New Customer Orders',data:d.NEW_ORDERS,backgroundColor:d.NEW_ORDERS.map((_,i)=>cCol(d.COEFF[i])+'99'),borderColor:d.NEW_ORDERS.map((_,i)=>cCol(d.COEFF[i])),borderWidth:1.5,borderRadius:6}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{grid:GL,ticks:TK},y:{grid:GL,ticks:TK,min:0}}}});

  // 11. NCPA
  chartInstances.ncpa = new Chart(document.getElementById('ncpaChart'),{type:'bar',data:{labels:MONTHS,datasets:[{label:'NCPA',data:d.NCPA,backgroundColor:d.NCPA.map(v=>v<=600?'rgba(16,185,129,.55)':v<=750?'rgba(245,158,11,.5)':'rgba(239,68,68,.55)'),borderColor:d.NCPA.map(v=>v<=600?'#10b981':v<=750?'#f59e0b':'#ef4444'),borderWidth:1.5,borderRadius:6}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{grid:GL,ticks:TK},y:{grid:GL,ticks:{...TK,callback:v=>'$'+v},min:0}}}});

  // 12. GT Category
  chartInstances.gtCat = new Chart(document.getElementById('gtCategoryChart'),{type:'line',data:{labels:MONTHS,datasets:[
    {label:d.GT_CAT_1_LABEL,data:d.GT_CAT_1,borderColor:accent,backgroundColor:`rgba(${accentRgb},.08)`,pointRadius:4,borderWidth:2.5,tension:0.4,fill:true},
    {label:d.GT_CAT_2_LABEL,data:d.GT_CAT_2,borderColor:'#10b981',backgroundColor:'rgba(16,185,129,.06)',pointRadius:4,borderWidth:2.5,tension:0.4,fill:true}
  ]},options:{responsive:true,maintainAspectRatio:false,scales:{x:{grid:GL,ticks:TK},y:{grid:GL,ticks:TK,min:0}}}});

  // 13. GT Alignment (dynamic y-axis based on combined coefficient & trends range)
  const gtNorm = d.GT_CAT_1.map(v=>v/(d.GT_CAT_1.reduce((a,b)=>a+b,0)/12));
  const _gtMax = Math.max(...d.COEFF, ...gtNorm);
  const _gtMin = Math.min(...d.COEFF, ...gtNorm);
  const _gtYMax = Math.ceil(_gtMax * 11) / 10;
  const _gtYMin = Math.max(0, Math.floor(_gtMin * 9) / 10);
  chartInstances.gtAlign = new Chart(document.getElementById('gtAlignChart'),{type:'line',data:{labels:MONTHS,datasets:[
    {label:'Brand Revenue Index',data:d.COEFF,borderColor:accent,backgroundColor:`rgba(${accentRgb},.1)`,pointRadius:5,borderWidth:3,tension:0.4},
    {label:d.GT_CAT_1_LABEL+' Search Index',data:gtNorm,borderColor:'#8b5cf6',pointRadius:4,borderWidth:2.5,tension:0.4,borderDash:[5,3]}
  ]},options:{responsive:true,maintainAspectRatio:false,scales:{x:{grid:GL,ticks:TK},y:{grid:GL,ticks:{...TK,callback:v=>v.toFixed(2)+'x'},min:_gtYMin,max:_gtYMax}}}});
}

// =============================================================
// INIT
// =============================================================
renderTabs();
applyTheme(BRANDS[activeBrand]);
renderDashboard();
</script>
